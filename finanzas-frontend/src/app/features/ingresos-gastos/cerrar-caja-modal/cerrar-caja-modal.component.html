<app-modal [isOpen]="isOpen" title="Cerrar Caja Chica" size="sm"
    [showFooter]="false" (modalClose)="cerrar()">

    <form (ngSubmit)="onSubmit()" #form="ngForm" class="space-y-4">

        <div class="bg-slate-50 rounded-lg p-3 text-center">
            <p class="text-xs text-slate-500 font-medium">Saldo Teórico Actual</p>
            <p class="text-2xl font-bold text-slate-800">S/ {{ saldoTeorico | number:'1.2-2' }}</p>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">Saldo Real (Físico)</label>
            <input type="number" [(ngModel)]="saldoReal" name="saldoReal" step="0.01" min="0" required
                class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm font-semibold text-slate-800 bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <label class="flex items-center gap-3 p-3 bg-blue-50 rounded-lg cursor-pointer select-none">
            <input type="checkbox" [(ngModel)]="transferir" name="transferir"
                class="w-5 h-5 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
            <span class="text-sm font-bold text-slate-700">Transferir saldo a Caja General</span>
        </label>

        <ng-container footer>
            <div class="flex justify-end gap-3 w-full">
                <button type="button" (click)="cerrar()" [disabled]="guardando"
                    class="px-5 py-2.5 text-sm font-bold text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors disabled:opacity-50">
                    Cancelar
                </button>
                <button type="submit" [disabled]="guardando"
                    class="px-5 py-2.5 text-sm font-bold text-white bg-red-600 rounded-lg hover:bg-red-700 transition-colors disabled:opacity-50 flex items-center gap-2">
                    <svg *ngIf="guardando" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                    </svg>
                    {{ guardando ? 'Cerrando...' : 'Confirmar Cierre' }}
                </button>
            </div>
        </ng-container>

    </form>

</app-modal>
