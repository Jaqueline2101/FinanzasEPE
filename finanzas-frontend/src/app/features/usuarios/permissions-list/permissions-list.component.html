<div class="h-full bg-slate-50 p-3 md:p-5 min-w-0 transition-all duration-300 ease-in-out">
  <app-breadcrumb [items]="breadcrumbItems" [showIcon]="true" class="mb-4 block"></app-breadcrumb>

  <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200">
    <app-page-header title="Diccionario de Permisos" subtitle="Catálogo técnico de privilegios." iconType="users"
      [counterValue]="totalPermissions" counterLabel="Permisos" [showCounter]="true" class="scale-95 origin-left">
    </app-page-header>

    <div class="p-4 md:p-6">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <div class="bg-slate-900 rounded-xl p-4 text-white shadow-sm border border-slate-700">
          <p class="text-slate-400 text-[9px] font-bold uppercase tracking-wider">Total</p>
          <div class="flex items-center justify-between">
            <p class="text-2xl font-black">{{ totalPermissions }}</p>
            <span class="text-lg opacity-40">🔑</span>
          </div>
        </div>

        <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
          <p class="text-indigo-600 text-[9px] font-bold uppercase tracking-wider">Módulos</p>
          <div class="flex items-center justify-between">
            <p class="text-2xl font-black text-slate-800">{{ totalModules }}</p>
            <span class="text-lg opacity-20">📦</span>
          </div>
        </div>

        <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
          <p class="text-emerald-600 text-[9px] font-bold uppercase tracking-wider">Filtrados</p>
          <div class="flex items-center justify-between">
            <p class="text-2xl font-black text-slate-800">{{ filteredGroups.length }}</p>
            <span class="text-lg opacity-20">🔍</span>
          </div>
        </div>

        <div class="bg-blue-50 rounded-xl p-4 border border-blue-100 shadow-sm">
          <p class="text-blue-600 text-[9px] font-bold uppercase tracking-wider">Vista</p>
          <p class="text-xs font-black text-blue-800 uppercase mt-1">Expandida</p>
        </div>
      </div>

      <div class="flex flex-col xl:flex-row gap-4 mb-6 items-start xl:items-center justify-between">
        <!-- Buscador y Select -->
        <div class="flex flex-col sm:flex-row gap-4 w-full xl:w-auto">
          <div class="w-full sm:w-[320px]">
            <app-search-generic [options]="[
                  { label: 'Todos', value: 'ALL' },
                  { label: 'Nombre', value: 'name' },
                  { label: 'Descripción', value: 'description' }
                ]" placeholder="Buscar capacidad..." (onSearch)="handleSearch($event)">
            </app-search-generic>
          </div>

          <select [(ngModel)]="selectedModule" (change)="onModuleChange()"
            class="w-full sm:w-[200px] h-[46px] px-4 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-slate-900 outline-none text-sm font-bold cursor-pointer hover:border-slate-300 transition-colors">
            <option [ngValue]="null">📦 Todos los módulos</option>
            <option *ngFor="let moduleName of moduleList" [value]="moduleName">
              {{ getModuleIcon(moduleName) }} {{ getModuleDisplayName(moduleName) }}
            </option>
          </select>
        </div>

        <!-- Botones Expandir/Colapsar -->
        <div class="flex gap-2 w-full xl:w-auto">
          <button (click)="expandAll()"
            class="flex-1 xl:flex-none px-4 py-2.5 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold text-xs uppercase hover:bg-slate-50 hover:border-slate-300 transition-all flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
            Expandir
          </button>
          <button (click)="collapseAll()"
            class="flex-1 xl:flex-none px-4 py-2.5 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold text-xs uppercase hover:bg-slate-50 hover:border-slate-300 transition-all flex items-center justify-center gap-2">
            <svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
            Colapsar
          </button>
        </div>
      </div>

      <!-- Loading Skeleton -->
      <div *ngIf="loading" class="space-y-3 animate-pulse">
        <div *ngFor="let i of [1, 2, 3]" class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <!-- Skeleton Header -->
          <div class="p-3 flex items-center justify-between border-l-4 border-slate-200">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 bg-slate-200 rounded-lg"></div>
              <div class="space-y-2">
                <div class="h-4 w-32 bg-slate-200 rounded"></div>
                <div class="h-2 w-20 bg-slate-200 rounded"></div>
              </div>
            </div>
          </div>
          <!-- Skeleton Body -->
          <div class="p-4 bg-slate-50 border-t border-slate-100">
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
              <div *ngFor="let j of [1, 2, 3, 4]" class="bg-white rounded-lg p-3 border border-slate-200 h-24">
                <div class="h-3 w-16 bg-slate-200 rounded mb-2"></div>
                <div class="h-2 w-full bg-slate-200 rounded mb-1"></div>
                <div class="h-2 w-2/3 bg-slate-200 rounded"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="!loading" class="space-y-3 transition-opacity duration-300 ease-in-out" [class.opacity-0]="loading"
        [class.opacity-100]="!loading">
        <div *ngFor="let group of filteredGroups"
          class="bg-white rounded-xl border border-slate-200 transition-all overflow-hidden shadow-sm">
          <button (click)="toggleModule(group)"
            class="w-full bg-white p-3 flex items-center justify-between hover:bg-slate-50 transition-colors border-l-4"
            [ngStyle]="{ 'border-l-color': group.expanded ? '#1E293B' : '#E2E8F0' }">
            <div class="flex items-center gap-3">
              <span class="text-xl w-10 h-10 flex items-center justify-center bg-slate-100 rounded-lg">{{ group.icon
                }}</span>
              <div class="text-left">
                <h3 class="text-sm font-bold text-slate-800 uppercase">
                  {{ group.displayName }}
                </h3>
                <p class="text-[9px] font-medium text-slate-400 uppercase tracking-tighter">
                  {{ group.permissions.length }} Capacidades
                </p>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <span
                class="hidden md:inline-block px-2 py-0.5 bg-slate-100 rounded text-slate-500 text-[9px] font-bold border border-slate-200">
                ID: {{ group.module }}
              </span>
              <svg class="w-4 h-4 text-slate-400 transition-transform duration-300" [class.rotate-180]="group.expanded"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </button>

          <div *ngIf="group.expanded" class="p-4 bg-slate-50 border-t border-slate-100">
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
              <div *ngFor="let permission of group.permissions"
                class="bg-white rounded-lg p-3 border border-slate-200 hover:shadow-md transition-all group relative">
                <div class="flex flex-col gap-2">
                  <div class="flex items-start justify-between">
                    <span class="px-2 py-0.5 rounded text-[9px] font-bold border uppercase tracking-wider"
                      [ngClass]="getActionColor(getPermissionActionType(permission.name))">
                      {{ permission.name }}
                    </span>
                    <span class="text-[8px] font-mono text-slate-300">#{{ permission.id }}</span>
                  </div>

                  <p class="text-xs text-slate-600 leading-snug line-clamp-2 min-h-[2.5rem]">
                    {{ permission.description }}
                  </p>

                  <div class="flex items-center gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
                    <div class="w-1 h-1 rounded-full bg-slate-300"></div>
                    <span class="text-[8px] font-bold text-slate-400 uppercase tracking-widest">Scope: {{ group.module
                      }}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [pageSize]="pageSize"
        [pageSizeOptions]="[10, 25, 50, 100]" (pageChange)="changePage($event)"
        (pageSizeChange)="changePageSize($event)">
      </app-pagination>
      <div *ngIf="filteredGroups.length === 0 && !loading" class="py-12 text-center">
        <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">
          No se encontraron coincidencias
        </p>
      </div>
    </div>
  </div>
</div>
