<div class="flex flex-col h-full bg-white">
    <!-- Header Section -->
    <div class="p-6 pb-0">
        <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

        <div class="mt-2 mb-2">
            <app-page-header title="Gestión de Paquetes"
                subtitle="Administra los paquetes promocionales, ofertas y campañas vigentes." [showCounter]="true"
                [counterLabel]="'Total'" [counterValue]="totalElements">
            </app-page-header>
        </div>
    </div>

    <!-- Content Section -->
    <div class="flex-1 pt-2 p-6 bg-gray-50 overflow-auto">

        <div class="h-full space-y-4">

            <!-- Main Content Card (Filters + Table) -->
            <div class="bg-white rounded-2xl shadow-sm ring-1 ring-black/5 p-6 animate-fadeIn">

                <!-- Unified Filter Bar -->
                <div class="mb-1">
                    <app-barra-filtros placeholder="Buscar por nombre o código..." [searchOptions]="searchOptions"
                        (onFilter)="handleFilters($event)">
                    </app-barra-filtros>
                </div>

                <!-- Actions Row -->
                <div class="flex justify-end items-end mb-4">
                    <app-primary-button label="Nuevo Paquete" icon="plus" (btnClick)="openCreateModal()">
                    </app-primary-button>
                </div>

                <!-- Data Table Container -->
                <div class="overflow-hidden border border-gray-100 rounded-xl mb-4">
                    <app-tabla-general [columnas]="columnas" [datos]="paquetesFiltrados" [showViewDetails]="true"
                        [showEdit]="true" [showDelete]="true" (viewDetails)="verDetalle($event)"
                        (onEdit)="openEditModal($event)" (onDelete)="deletePaquete($event)">
                    </app-tabla-general>
                </div>

                <!-- Pagination Section -->
                <div class="pt-4 border-t border-gray-50">
                    <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [pageSize]="pageSize"
                        (pageChange)="onPageChange($event)">
                    </app-pagination>
                </div>

            </div>

            <!-- Create/Edit Modal - Refined Design -->
            <app-modal-paquete [isVisible]="showModal" [paquete]="selectedPaquete" [categoria]="'PAQUETE_REGULAR'"
                (onClose)="closeModal()" (onSave)="onSaveSuccess()">
            </app-modal-paquete>

            <!-- Detail Modal -->
            <app-modal-detalle [isVisible]="showModalDetalle" [paquete]="selectedPaqueteDetalle"
                (onClose)="closeModalDetalle()">
            </app-modal-detalle>
        </div>

    </div>
</div>
