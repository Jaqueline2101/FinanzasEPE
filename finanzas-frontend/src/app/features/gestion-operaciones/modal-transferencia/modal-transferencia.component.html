<app-modal [isOpen]="show" [title]="isCierreCaja ? 'Cierre de Caja' : 'Nueva Transferencia Entre Cuentas'"
    [iconType]="isCierreCaja ? 'document' : 'edit'" [showFooter]="true" (modalClose)="onClose()">

    <!-- Body -->
    <div class="space-y-4">
        <!-- Origin Account (Custom Dropdown) -->
        <div class="relative">
            <label
                class="flex items-center gap-1 h-4 text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1">Cuenta
                de Origen
                <span class="text-rose-500 text-xl leading-none">*</span></label>

            <!-- Dropdown Trigger -->
            <div (click)="toggleOriginDropdown()"
                class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm bg-white dark:text-white font-bold flex justify-between items-center cursor-pointer hover:border-slate-400 transition-all shadow-sm">
                <span *ngIf="getOriginCuenta()">{{ getCuentaDisplayText(getOriginCuenta()!) }}</span>
                <span *ngIf="!getOriginCuenta()" class="text-slate-400 font-normal">Seleccionar cuenta...</span>
                <svg class="w-4 h-4 text-slate-500 transition-transform duration-200"
                    [class.rotate-180]="isOriginDropdownOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </div>

            <!-- Custom Dropdown Menu (Negro) -->
            <div *ngIf="isOriginDropdownOpen"
                class="absolute left-0 right-0 mt-1 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-50 overflow-hidden animate-fadeInScale">
                <div class="max-h-60 overflow-y-auto py-1 scrollbar-thin scrollbar-thumb-slate-700">
                    <div *ngFor="let c of cuentas" (click)="selectOriginCuenta(c)"
                        class="px-4 py-3 hover:bg-slate-800 cursor-pointer border-b border-white/5 last:border-0 transition-colors group">
                        <div class="flex flex-col gap-0.5">
                            <span class="text-white text-sm font-bold group-hover:text-blue-400 transition-colors">
                                {{ getCuentaDisplayText(c) }}
                            </span>
                            <div class="flex justify-between items-center text-[11px]">
                                <span class="text-slate-400 uppercase tracking-wider font-semibold">{{ c.numeroCuenta
                                    }}</span>
                                <span
                                    class="px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 font-bold border border-blue-500/20">
                                    {{ getSaldoFormateado(c) }}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Overlay -->
            <div *ngIf="isOriginDropdownOpen" (click)="isOriginDropdownOpen = false"
                class="fixed inset-0 z-40 bg-transparent"></div>
        </div>

        <!-- Destination Account (Custom Dropdown) -->
        <div class="relative">
            <label
                class="flex items-center gap-1 h-4 text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1">Cuenta
                de Destino
                <span class="text-rose-500 text-xl leading-none">*</span></label>

            <!-- Dropdown Trigger -->
            <div (click)="toggleDestDropdown()"
                class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm bg-white dark:text-white font-bold flex justify-between items-center cursor-pointer hover:border-slate-400 transition-all shadow-sm">
                <span *ngIf="getDestCuenta()">{{ getCuentaDisplayText(getDestCuenta()!) }}</span>
                <span *ngIf="!getDestCuenta()" class="text-slate-400 font-normal">Seleccionar cuenta...</span>
                <svg class="w-4 h-4 text-slate-500 transition-transform duration-200"
                    [class.rotate-180]="isDestDropdownOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </div>

            <!-- Custom Dropdown Menu (Negro) -->
            <div *ngIf="isDestDropdownOpen"
                class="absolute left-0 right-0 mt-1 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-50 overflow-hidden animate-fadeInScale">
                <div class="max-h-60 overflow-y-auto py-1 scrollbar-thin scrollbar-thumb-slate-700">
                    <div *ngFor="let c of cuentas" [class.hidden]="c.idCuenta === transferencia.idCuentaOrigen"
                        (click)="selectDestCuenta(c)"
                        class="px-4 py-3 hover:bg-slate-800 cursor-pointer border-b border-white/5 last:border-0 transition-colors group">
                        <div class="flex flex-col gap-0.5">
                            <span class="text-white text-sm font-bold group-hover:text-blue-400 transition-colors">
                                {{ getCuentaDisplayText(c) }}
                            </span>
                            <div class="flex justify-between items-center text-[11px]">
                                <span class="text-slate-400 uppercase tracking-wider font-semibold">{{ c.numeroCuenta
                                    }}</span>
                                <span
                                    class="px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 font-bold border border-blue-500/20">
                                    {{ getSaldoFormateado(c) }}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Overlay -->
            <div *ngIf="isDestDropdownOpen" (click)="isDestDropdownOpen = false"
                class="fixed inset-0 z-40 bg-transparent"></div>
        </div>

        <!-- Amount -->
        <div>
            <label
                class="flex items-center gap-1 h-4 text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1">Monto
                a Transferir
                <span class="text-rose-500 text-xl leading-none">*</span></label>
            <input type="number" [(ngModel)]="montoDisplay" (focus)="onMontoFocus()" (blur)="onMontoBlur()"
                (ngModelChange)="onMontoChange()"
                class="monto-input w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm font-bold"
                step="0.01" min="0">
        </div>

        <!-- Reference -->
        <div>
            <label
                class="flex items-center h-4 text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1">Referencia /
                N°
                Op.</label>
            <input type="text" [(ngModel)]="transferencia.referencia"
                class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm placeholder:text-slate-400 placeholder:font-light font-bold"
                placeholder="Ej. 123456">
        </div>

        <!-- Description - Ampliado -->
        <div>
            <label
                class="flex items-center h-4 text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1">Descripción</label>
            <textarea [(ngModel)]="transferencia.descripcion"
                class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm placeholder:text-slate-400 placeholder:font-light font-bold resize-vertical"
                rows="3" placeholder="Motivo de la transferencia..."></textarea>
        </div>
    </div>

    <!-- Footer Actions -->
    <div footer class="flex gap-2">
        <button (click)="onClose()"
            class="px-4 py-2 text-sm font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800">
            Cancelar
        </button>
        <button (click)="onSubmit()" [disabled]="isLoading"
            class="px-4 py-2 text-sm font-bold text-white bg-slate-900 dark:bg-blue-600 hover:bg-slate-800 dark:hover:bg-blue-500 rounded-lg transition-all shadow-sm">
            {{ isLoading ? 'Procesando...' : 'Confirmar Transferencia' }}
        </button>
    </div>

</app-modal>
