<app-modal [isOpen]="isVisible" [title]="isEditMode ? 'Actualizar Empresa' : 'Nueva Empresa'" [size]="'lg'"
    [closeOnBackdrop]="false" [showFooter]="true" (modalClose)="close()">

    <div class="grid grid-cols-1 gap-6">
        <!-- Información General -->
        <div class="space-y-4">
            <h4 class="text-sm font-semibold text-slate-500 uppercase tracking-wider border-b pb-2">Datos Principales
            </h4>

            <div>
                <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">
                    Nombre Comercial
                    <span class="text-rose-500 text-xl leading-none">*</span>
                </label>
                <input type="text" [(ngModel)]="formData.abrev" (blur)="validateField('abrev')"
                    [ngClass]="{'border-red-500': errors.abrev, 'border-slate-300': !errors.abrev}"
                    class="w-full px-3 py-2 bg-white border rounded-lg text-sm text-slate-900 placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all"
                    placeholder="Reuma Center">
                <small class="text-red-500 text-xs mt-1 block" *ngIf="errors.abrev">{{ errors.abrev }}</small>
            </div>

            <div>
                <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">
                    Razón Social
                    <span class="text-rose-500 text-xl leading-none">*</span>
                </label>
                <input type="text" [(ngModel)]="formData.nombre" (blur)="validateField('nombre')"
                    [ngClass]="{'border-red-500': errors.nombre, 'border-slate-300': !errors.nombre}"
                    class="w-full px-3 py-2 bg-white border rounded-lg text-sm text-slate-900 placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all"
                    placeholder="Reuma Center S.a.C.">
                <small class="text-red-500 text-xs mt-1 block" *ngIf="errors.nombre">{{ errors.nombre }}</small>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">
                        RUC
                        <span class="text-rose-500 text-xl leading-none">*</span>
                    </label>
                    <input type="text" [(ngModel)]="formData.ruc" (blur)="searchRuc(); validateField('ruc')"
                        [ngClass]="{'border-red-500': errors.ruc, 'border-slate-300': !errors.ruc}"
                        class="w-full px-3 py-2 bg-white border rounded-lg text-sm text-slate-900 placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all"
                        placeholder="20138122256">
                    <small class="text-red-500 text-xs mt-1 block" *ngIf="errors.ruc">{{ errors.ruc }}</small>
                </div>
                <div>
                    <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">
                        Código
                        <span class="text-rose-500 text-xl leading-none">*</span>
                    </label>
                    <input type="text" [(ngModel)]="formData.codigo" (blur)="validateField('codigo')"
                        [ngClass]="{'border-red-500': errors.codigo, 'border-slate-300': !errors.codigo}"
                        class="w-full px-3 py-2 bg-white border rounded-lg text-sm text-slate-900 placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all"
                        placeholder="REUMA01">
                    <small class="text-red-500 text-xs mt-1 block" *ngIf="errors.codigo">{{ errors.codigo }}</small>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">
                        Representante
                        <span class="text-rose-500 text-xl leading-none">*</span>
                    </label>
                    <input type="text" [(ngModel)]="formData.representante" (blur)="validateField('representante')"
                        [ngClass]="{'border-red-500': errors.representante, 'border-slate-300': !errors.representante}"
                        class="w-full px-3 py-2 bg-white border rounded-lg text-sm text-slate-900 placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all"
                        placeholder="Nombre del representante">
                    <small class="text-red-500 text-xs mt-1 block" *ngIf="errors.representante">{{ errors.representante
                        }}</small>
                </div>
                <div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">
                        Teléfono
                        <span class="text-rose-500 text-xl leading-none">*</span>
                    </label>
                    <input type="text" [(ngModel)]="formData.telefono" (blur)="validateField('telefono')"
                        [ngClass]="{'border-red-500': errors.telefono, 'border-slate-300': !errors.telefono}"
                        class="w-full px-3 py-2 bg-white border rounded-lg text-sm text-slate-900 placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all"
                        placeholder="051-987654321">
                    <small class="text-red-500 text-xs mt-1 block" *ngIf="errors.telefono">{{ errors.telefono }}</small>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Estado</label>
                    <div class="flex items-center gap-2 mt-2">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" [ngModel]="formData.estado == '1'"
                                (ngModelChange)="formData.estado = $event ? '1' : '0'"
                                class="w-4 h-4 text-green-600 rounded border-slate-300 focus:ring-green-500 transition-all">
                            <span
                                class="text-sm text-slate-700 group-hover:text-slate-900 transition-colors">Activo</span>
                        </label>
                    </div>
                </div>
            </div>

            <div>
                <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">
                    Dirección
                    <span class="text-rose-500 text-xl leading-none">*</span>
                </label>
                <input type="text" [(ngModel)]="formData.direccion" (blur)="validateField('direccion')"
                    [ngClass]="{'border-red-500': errors.direccion, 'border-slate-300': !errors.direccion}"
                    class="w-full px-3 py-2 bg-white border rounded-lg text-sm text-slate-900 placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all"
                    placeholder="Dirección fiscal">
                <small class="text-red-500 text-xs mt-1 block" *ngIf="errors.direccion">{{ errors.direccion }}</small>
            </div>

        </div>
    </div>

    <div footer class="w-full flex justify-end gap-3">
        <button (click)="close()"
            class="px-4 py-2 bg-white border border-slate-300 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-50 transition-all">
            Cancelar
        </button>
        <button (click)="save()"
            class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 shadow-md shadow-blue-500/20 transition-all flex items-center gap-2">
            <svg *ngIf="!isEditMode" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <svg *ngIf="isEditMode" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            {{ isEditMode ? 'Actualizar' : 'Guardar' }}
        </button>
    </div>

</app-modal>
