<app-modal [isOpen]="isVisible" [title]="'Detalle de Empresa'" [size]="'lg'" [showFooter]="true" [closeOnBackdrop]="false" (modalClose)="close()">

    <div class="grid grid-cols-1 gap-6">
        <!-- Información General -->
        <div class="space-y-4">
            <h4 class="text-sm font-semibold text-slate-500 uppercase tracking-wider border-b pb-2">Datos Principales
            </h4>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nombre Comercial</label>
                <div class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900">
                    {{ empresa?.abrev || '-' }}
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Razón Social</label>
                <div class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900">
                    {{ empresa?.nombre || '-' }}
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">RUC</label>
                    <div class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900">
                        {{ empresa?.ruc || '-' }}
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Código</label>
                    <div class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900">
                        {{ empresa?.codigo || '-' }}
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Representante</label>
                    <div class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900">
                        {{ empresa?.representante || '-' }}
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Fecha de Creación</label>
                    <div class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900">
                        {{ empresa?.fechaCre | date:'dd/MM/yyyy' }}
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Teléfono</label>
                    <div class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900">
                        {{ empresa?.telefono || '-' }}
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Estado</label>
                    <div class="mt-2">
                        <span *ngIf="empresa?.estado === '1'"
                            class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
                            Activo
                        </span>
                        <span *ngIf="empresa?.estado !== '1'"
                            class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-red-100 text-red-800">
                            Inactivo
                        </span>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Dirección</label>
                <div class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900">
                    {{ empresa?.direccion || '-' }}
                </div>
            </div>

        </div>
    </div>

    <div footer class="w-full flex justify-end gap-3">
        <button (click)="close()"
            class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 shadow-md shadow-blue-500/20 transition-all">
            Cerrar
        </button>
    </div>

</app-modal>
