<app-modal *ngIf="isOpen" 
    [title]="'Ajustar Comprobante'" 
    [isOpen]="isOpen"
    (modalClose)="onClose()" 
    size="md">
    
    <div class="px-5 py-4 space-y-4 bg-white dark:bg-slate-800">
        <!-- Información del Proveedor (Lectura) -->
        <div class="bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-100 dark:border-slate-700">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Proveedor</p>
            <p class="text-sm font-bold text-slate-700 dark:text-slate-200">{{ compra?.proveedor?.razonSocial }}</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Tipo de Documento -->
            <div>
                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1.5">Tipo de Documento</label>
                <select [(ngModel)]="editForm.tipoDocumento"
                    class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none font-bold text-sm text-slate-700 dark:text-slate-200">
                    <option value="FACTURA">FACTURA</option>
                    <option value="BOLETA">BOLETA</option>
                </select>
            </div>

            <!-- Serie -->
            <div>
                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1.5">Serie</label>
                <input type="text" [(ngModel)]="editForm.serie"
                    class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none font-bold text-sm text-slate-700 dark:text-slate-200"
                    placeholder="Ej. F001">
            </div>
        </div>

        <!-- Alerta suave -->
        <div class="flex items-start gap-2.5 p-3 rounded-lg bg-amber-50 dark:bg-amber-900/20 border border-amber-100 dark:border-amber-800 mt-2">
            <svg class="w-4 h-4 text-amber-600 dark:text-amber-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <p class="text-[11px] text-amber-700 dark:text-amber-400 leading-normal">
                Este ajuste solo modifica la información visual del comprobante. Asegúrese de que coincida con el documento físico.
            </p>
        </div>

        <div class="flex justify-end gap-3 pt-4 mt-2 border-t border-slate-100 dark:border-slate-700">
            <button (click)="onClose()"
                class="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 font-bold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all text-sm">
                Cancelar
            </button>
            <button (click)="onSave()"
                class="px-6 py-2 rounded-lg bg-blue-600 text-white font-bold hover:bg-blue-700 shadow-md shadow-blue-200 dark:shadow-none transition-all text-sm">
                Guardar Ajustes
            </button>
        </div>
    </div>
</app-modal>
