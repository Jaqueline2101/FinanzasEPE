<div class="h-full bg-linear-to-br from-gray-50 to-blue-50 dark:from-slate-900 dark:to-slate-800 p-4 md:p-6 min-w-0 transition-all duration-300 ease-in-out">
    <app-breadcrumb [items]="breadcrumbItems" [showIcon]="true"></app-breadcrumb>

    <!-- Header Separado -->
    <div class="mb-3">
        <app-page-header title="Gestión de Sucursales"
            subtitle="Administra las sedes y puntos de atención de la organización" iconType="settings" [showCounter]="true"
            counterLabel="Total" [counterValue]="totalElements">
        </app-page-header>
    </div>

    <!-- Contenedor Principal (Card) -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-gray-100 dark:border-slate-700 p-6">
        <div class="space-y-6 animate-fadeIn">
            
            <!-- Barra de Filtros -->
            <app-barra-filtros 
                placeholder="Buscar por nombre o dirección..." 
                [searchOptions]="searchOptions"
                (onFilter)="handleFilters($event)">
            </app-barra-filtros>

            <!-- Acciones -->
            <div class="flex justify-end">
                <app-primary-button (click)="openCreateModal()" icon="plus" label="Nueva Sucursal">
                </app-primary-button>
            </div>

            <!-- Main Content Grid (Permanently Split) -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                
                <!-- Columna Izquierda: Tabla Master (7/12) -->
                <div class="lg:col-span-7 space-y-4">
                    <div class="overflow-hidden rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm transition-all hover:shadow-md">
                        <app-tabla-general 
                            [columnas]="columns" 
                            [datos]="filteredSucursales" 
                            [loading]="isLoading" 
                            [currentPage]="currentPage"
                            [pageSize]="pageSize" 
                            [selectedItem]="selectedSucursalForPuntos"
                            (onRowClick)="onRowClick($event)"
                            (onEdit)="openEditModal($event)" 
                            (onDelete)="deleteSucursal($event)">
                        </app-tabla-general>
                    </div>

                    <!-- Pagination -->
                    <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [pageSize]="pageSize"
                        (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
                    </app-pagination>
                </div>

                <!-- Columna Derecha: Panel Detalle (5/12) -->
                <div class="lg:col-span-5 sticky top-4">
                    <div *ngIf="selectedSucursalForPuntos; else emptyState" class="animate-fadeIn">
                        <app-puntos-panel 
                            [sucursal]="selectedSucursalForPuntos"
                            (onOpenModal)="onOpenPuntoModal($event)">
                        </app-puntos-panel>
                    </div>

                    <!-- Empty State (Inside Panel Column) -->
                    <ng-template #emptyState>
                        <div class="flex flex-col items-center justify-center py-16 bg-slate-50/50 dark:bg-slate-900/50 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-800">
                            <div class="w-16 h-16 bg-white dark:bg-slate-800 rounded-full shadow-sm flex items-center justify-center mb-4">
                                <i class="fas fa-mouse-pointer text-slate-300 dark:text-slate-600 text-xl"></i>
                            </div>
                            <p class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest text-center px-6">
                                Seleccione una sucursal para gestionar sus puntos de atención
                            </p>
                        </div>
                    </ng-template>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Form Sucursal -->
<app-modal-sucursal 
    [isVisible]="isModalVisible" 
    [sucursal]="selectedSucursal" 
    (modalClose)="onModalClose($event)">
</app-modal-sucursal>

<!-- Modal Form Puntos (Movido a la raíz para evitar solapamiento visual) -->
<app-modal-punto 
    [isVisible]="isPuntoModalVisible" 
    [sucursal]="selectedSucursalForPuntos" 
    [punto]="selectedPuntoForEdit"
    (modalClose)="onPuntoModalClose($event)">
</app-modal-punto>
