<div class="h-full flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden animate-in fade-in slide-in-from-right-4 duration-500">
    <!-- Header -->
    <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between">
        <div>
            <h3 class="text-sm font-black text-slate-800 uppercase tracking-tight">
                Puntos de Atención
            </h3>
            <p class="text-[10px] font-bold text-blue-600 uppercase tracking-wider">
                {{ sucursal?.nombreSucursal }}
            </p>
        </div>
        <button (click)="openCreate()"
            class="inline-flex items-center px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-black rounded-lg transition-all shadow-sm active:scale-95">
            <i class="fas fa-plus mr-1.5"></i> NUEVO PUNTO
        </button>
    </div>

    <!-- Content Area -->
    <div class="flex-1 overflow-y-auto p-4 custom-scrollbar">
        <!-- Points List -->
        <div class="space-y-3">
            <div *ngFor="let punto of puntos; let i = index" 
                class="group relative bg-white border border-slate-100 rounded-xl p-3 hover:border-blue-200 hover:shadow-md transition-all duration-300">
                <div class="flex items-start justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-slate-50 flex items-center justify-center text-[10px] font-black text-slate-400 group-hover:bg-blue-50 group-hover:text-blue-500 transition-colors">
                            {{ i + 1 }}
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h5 class="text-xs font-black text-slate-800">{{ punto.nombre }}</h5>
                                <span class="px-1.5 py-0.5 rounded text-[8px] font-black uppercase tracking-tighter"
                                    [ngClass]="punto.tipo === 'F' ? 'bg-indigo-50 text-indigo-600 border border-indigo-100' : 'bg-amber-50 text-amber-600 border border-amber-100'">
                                    {{ punto.tipo === 'F' ? 'Venta' : 'Admin' }}
                                </span>
                            </div>
                            <p class="text-[10px] font-bold text-slate-400 mt-0.5">CÓDIGO: {{ punto.punto }}</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button (click)="openEdit(punto)" class="p-1.5 text-amber-500 hover:bg-amber-50 rounded-lg transition-colors" title="Editar">
                            <i class="fas fa-edit text-[11px]"></i>
                        </button>
                        <button (click)="deletePunto(punto)" class="p-1.5 text-rose-500 hover:bg-rose-50 rounded-lg transition-colors" title="Desactivar">
                            <i class="fas fa-trash-alt text-[11px]"></i>
                        </button>
                    </div>
                </div>

                <!-- Status Badge -->
                <div class="mt-2 flex justify-end">
                    <span *ngIf="punto.valido === '1'" (click)="toggleEstado(punto)" 
                        class="cursor-pointer inline-flex items-center px-2 py-0.5 rounded-full text-[8px] font-black bg-emerald-50 text-emerald-600 border border-emerald-100 transition-transform active:scale-95">
                        <span class="w-1 h-1 bg-emerald-500 rounded-full mr-1 animate-pulse"></span> ACTIVO
                    </span>
                    <span *ngIf="punto.valido === '0'" (click)="toggleEstado(punto)" 
                        class="cursor-pointer inline-flex items-center px-2 py-0.5 rounded-full text-[8px] font-black bg-slate-100 text-slate-400 border border-slate-200 transition-transform active:scale-95">
                        <span class="w-1 h-1 bg-slate-400 rounded-full mr-1"></span> INACTIVO
                    </span>
                </div>
            </div>

            <!-- Empty State -->
            <div *ngIf="puntos.length === 0 && !isLoading" class="flex flex-col items-center justify-center py-12 px-4 text-center">
                <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mb-4">
                    <i class="fas fa-map-marker-alt text-slate-200 text-2xl"></i>
                </div>
                <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest">Sin puntos registrados</p>
                <p class="text-[10px] font-medium text-slate-300 mt-1">Haga clic en el botón superior para agregar el primer punto de atención.</p>
            </div>

            <!-- Loading State -->
            <div *ngIf="isLoading" class="flex flex-col items-center justify-center py-12">
                <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-blue-600 border-t-transparent"></div>
                <p class="mt-3 text-[10px] font-black text-slate-400 uppercase tracking-widest">Sincronizando...</p>
            </div>
        </div>
    </div>
</div>
