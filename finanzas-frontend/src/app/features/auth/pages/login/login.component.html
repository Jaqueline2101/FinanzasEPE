<div class="min-h-screen flex items-center justify-center relative">
    <!-- Fondo con gradiente moderno -->
    <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-[#1E293B] via-[#0F172A] to-[#1E293B]">
    </div>

    <!-- Contenido centrado (tu card de login) -->
    <div class="relative z-10 w-full px-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md mx-auto">
            <h1 class="text-center pt-6 text-[#0F172A] text-2xl font-semibold mb-6">
                ¡Bienvenido(a) a Finanzas!
            </h1>

            <p class="text-center text-[#475569] text-sm mb-6">
                Inicio de sesión
            </p>

            <form (ngSubmit)="iniciarSesion()" class="space-y-4 px-2">
                <!-- Campo Usuario -->
                <div>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" [(ngModel)]="usuario" name="usuario" placeholder="Usuario"
                            autocomplete="username"
                            class="w-full pl-10 pr-4 py-3 border border-[#CBD5E1] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1D4ED8] focus:border-transparent transition-colors" />
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input [type]="mostrarContrasena ? 'text' : 'password'" [(ngModel)]="contrasena"
                            name="contraseña" placeholder="Contraseña" autocomplete="current-password"
                            class="w-full pl-10 pr-10 py-3 border border-[#CBD5E1] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1D4ED8] focus:border-transparent transition-colors" />
                        <button type="button" (click)="toggleMostrarContrasena()"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
                            <svg *ngIf="!mostrarContrasena" class="w-5 h-5" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg *ngIf="mostrarContrasena" class="w-5 h-5" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Mensaje de error si hay -->
                <div *ngIf="error" class="p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm text-center">
                    {{ mensajeError || 'Usuario o contraseña incorrectos' }}
                </div>

                <!-- Botón de Login Principal -->
                <button type="button" (click)="iniciarSesion()" [disabled]="cargando"
                    class="w-full bg-[#2563EB] hover:bg-[#1D4ED8] text-white font-medium py-3 px-4 rounded-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm hover:shadow-md cursor-pointer">
                    <span *ngIf="!cargando">Ingresar</span>
                    <span *ngIf="cargando" class="flex items-center justify-center">
                        <svg class="animate-spin h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Verificando credenciales...
                    </span>
                </button>

                <!-- Botón de Acceso Rápido Administrador -->
                <button type="button" (click)="usarAdmin()" [disabled]="cargando"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 disabled:opacity-50 shadow-sm text-sm cursor-pointer flex items-center justify-center gap-2">
                    <span>⚡ Entrar Directo como Administrador</span>
                </button>
            </form>

            <!-- Decoración inferior -->
            <div class="absolute -bottom-3 left-1/2 -translate-x-1/2
              w-6 h-6 bg-white rotate-45 shadow-xl">
            </div>
        </div>
    </div>
</div>
