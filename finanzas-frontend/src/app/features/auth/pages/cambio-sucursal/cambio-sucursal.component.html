<!-- Contenido Principal - Área que cambia SIN margen izquierdo para centrado completo -->
<div class="flex-1 flex flex-col h-full">

    <!-- Breadcrumb - Justo debajo del header -->
    <div class="px-6 pt-4">
        <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
    </div>

    <!-- Alerta de éxito/error - Modal centrado -->
    <div *ngIf="alertaMostrada && !mostrandoTransicion"
        class="fixed inset-0 z-50 flex items-center justify-center px-4 animate-fade-in bg-black/50 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl border-0 max-w-lg w-full transform transition-all scale-100"
            [class.ring-4]="alertaTipo === 'error'" [class.ring-red-500/30]="alertaTipo === 'error'"
            [class.ring-green-500/30]="alertaTipo === 'success'">
            <div class="p-6">
                <div class="flex items-start space-x-4">
                    <div class="flex-shrink-0">
                        <svg *ngIf="alertaTipo === 'success'" class="w-8 h-8 text-green-600" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <svg *ngIf="alertaTipo === 'error'" class="w-8 h-8 text-red-600" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <div class="flex-1">
                        <p [class.text-green-800]="alertaTipo === 'success'"
                            [class.text-red-800]="alertaTipo === 'error'" class="font-semibold text-base">
                            {{ alertaMensaje }}
                        </p>
                    </div>
                    <button (click)="alertaMostrada = false" class="flex-shrink-0 text-gray-400 hover:text-gray-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Formulario - Solo visible cuando NO está en transición -->
    <main *ngIf="!mostrandoTransicion" class="flex-1 p-6 flex items-center justify-center">
        <div
            class="max-w-2xl w-full bg-white dark:bg-slate-800 rounded-xl shadow-xl overflow-hidden border border-slate-200 dark:border-slate-700 animate-slideUp">
            <!-- Header del formulario -->
            <div class="px-5 py-3 border-b border-slate-200 dark:border-slate-700">
                <div class="flex items-center gap-2.5">
                    <div
                        class="bg-blue-50 dark:bg-blue-900/30 p-1.5 rounded-lg border border-blue-200 dark:border-blue-800">
                        <svg class="w-4 h-4 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                        </svg>
                    </div>
                    <h3 class="text-base font-bold text-slate-900 dark:text-slate-50">Cambio de sucursal</h3>
                </div>
            </div>

            <!-- Contenido del formulario -->
            <div class="p-5 bg-white dark:bg-slate-800">
                <form class="space-y-4">
                    <!-- Campo Usuario -->
                    <div>
                        <label
                            class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5">Usuario</label>
                        <input type="text" [(ngModel)]="usuario" name="usuario" placeholder="Usuario"
                            class="w-full px-3 py-2 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-semibold text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder:text-slate-400 placeholder:font-light transition-all" />
                    </div>

                    <!-- Campo Contraseña -->
                    <div>
                        <label
                            class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5">Contraseña</label>
                        <input type="password" [(ngModel)]="nuevaContrasena" name="nuevaContrasena"
                            placeholder="Contraseña"
                            class="w-full px-3 py-2 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-semibold text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder:text-slate-400 placeholder:font-light transition-all" />
                    </div>

                    <!-- Campo Sucursales -->
                    <div>
                        <label
                            class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5">Sucursales</label>
                        <div class="relative">
                            <select [(ngModel)]="sucursalSeleccionada" name="sucursalSeleccionada"
                                (change)="onSucursalChange()" [disabled]="bloqueoCajero"
                                class="w-full px-3 py-2 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-semibold text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none cursor-pointer pr-10 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                <option value="" disabled>Seleccione una sucursal</option>
                                <option *ngFor="let sucursal of sucursales" [value]="sucursal.nombreSucursal">
                                    {{ sucursal.nombreSucursal }}
                                </option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Campo Punto de Venta -->
                    <div *ngIf="sucursalSeleccionada">
                        <label class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5">
                            Punto de Venta
                            <span *ngIf="cargandoPuntos"
                                class="ml-2 text-xs text-blue-500 font-normal">Cargando...</span>
                            <span *ngIf="bloqueoCajero" class="ml-2 text-xs text-red-500 font-bold">(BLOQUEADO)</span>
                        </label>
                        <div class="relative">
                            <select [(ngModel)]="puntoSeleccionado" name="puntoSeleccionado"
                                [disabled]="cargandoPuntos || puntosVenta.length === 0 || bloqueoCajero"
                                class="w-full px-3 py-2 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-semibold text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none cursor-pointer pr-10 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                <option value="" disabled>
                                    {{ puntosVenta.length === 0 && !cargandoPuntos ? 'No hay puntos disponibles' :
                                    'Seleccione un punto de venta' }}
                                </option>
                                <option *ngFor="let punto of puntosVenta" [value]="punto.nombre">
                                    {{ punto.nombre }}
                                </option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                                <svg *ngIf="!cargandoPuntos" class="w-4 h-4 text-slate-400" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7" />
                                </svg>
                                <svg *ngIf="cargandoPuntos" class="w-4 h-4 text-blue-500 animate-spin" fill="none"
                                    viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                        stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor"
                                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                    </path>
                                </svg>
                            </div>
                        </div>
                        <p *ngIf="puntosVenta.length === 0 && !cargandoPuntos && sucursalSeleccionada"
                            class="text-xs text-amber-600 mt-1">
                            Esta sucursal no tiene puntos de venta activos. Puede ingresar solo a la sucursal.
                        </p>
                    </div>
                </form>
            </div>

            <!-- Footer -->
            <div
                class="flex justify-end gap-2 px-5 py-3 bg-slate-50 dark:bg-slate-900/50 border-t border-slate-200 dark:border-slate-700">
                <button type="button" (click)="guardarCambios()"
                    [disabled]="!sucursalSeleccionada || loading || guardando || bloqueoCajero"
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg shadow-md shadow-blue-500/20 transition-all flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg *ngIf="!guardando" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <svg *ngIf="guardando" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    <span *ngIf="!guardando">Guardar</span>
                    <span *ngIf="guardando">Guardando...</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Mensaje de Bienvenida - Reemplaza el contenido principal -->
    <main *ngIf="mostrandoTransicion"
        class="flex-1 flex items-center justify-center bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 animate-fade-in p-6">
        <div class="text-center px-8 max-w-3xl w-full">
            <!-- Icono de check grande con animación -->
            <div class="mb-10 animate-scale-in">
                <div
                    class="inline-flex items-center justify-center w-28 h-28 bg-gradient-to-br from-green-400 to-green-600 rounded-full shadow-2xl">
                    <svg class="w-16 h-16 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            </div>

            <!-- Mensaje de bienvenida con mejor tipografía -->
            <h1
                class="text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-6 tracking-tight animate-slide-up">
                ¡Bienvenido!
            </h1>
            <p class="text-4xl font-semibold text-gray-700 mb-12 tracking-wide animate-slide-up-delay">
                Sede de {{ nombreSucursalSeleccionada }}
            </p>

            <!-- Instrucción con diseño mejorado -->
            <div class="mt-16 animate-fade-in-delay">
                <div class="inline-block p-8 bg-white rounded-2xl shadow-xl border border-gray-100">
                    <div class="flex items-center justify-center space-x-3 mb-3">
                        <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                        <p class="text-xl font-semibold text-gray-800">
                            Listo para comenzar
                        </p>
                    </div>
                    <p class="text-base text-gray-600">
                        Use el menú lateral para navegar por el sistema
                    </p>
                </div>

                <!-- Botón Volver con separación -->
                <div class="mt-8">
                    <button (click)="volverASeleccion()"
                        class="inline-flex items-center px-6 py-3 bg-[#1e3a8a] hover:bg-[#1e40af] text-white font-medium rounded-lg transition duration-200 shadow-sm hover:shadow-md">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        Volver a seleccionar sucursal
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>
