<div class="min-h-screen bg-slate-50/50 pb-8 pt-6 animate-fadeIn">
    <!-- Breadcrumb -->
    <div class="px-4 sm:px-6 lg:px-8 mb-4">
        <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
    </div>

    <!-- Header -->
    <div class="px-4 sm:px-6 lg:px-8 mb-8">
        <app-page-header 
            title="Anular Compra" 
            subtitle="Gestión de anulación de órdenes de compra vigentes"
            icon="fas fa-ban" 
            [counterValue]="registros.length" 
            counterLabel="Órdenes disponibles">
        </app-page-header>
    </div>

    <!-- Contenido Principal -->
    <div class="px-4 sm:px-6 lg:px-8 mt-6">
        <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800 p-6 space-y-6">
            <!-- Barra de Filtros -->
            <app-barra-filtros 
                placeholder="Buscar por número o proveedor..."
                [searchOptions]="searchOptions"
                [estadoOptions]="estadoOptions"
                [showDates]="true"
                (onFilter)="onFilter($event)">
            </app-barra-filtros>

            <!-- Tabla de Resultados -->
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 overflow-hidden">
                <app-tabla-general 
                    [columnas]="columnas" 
                    [datos]="displayedRegistros" 
                    [loading]="loading"
                    (onLinkAction)="handleAction($event)">
                </app-tabla-general>

                <!-- Paginación -->
                <div class="p-4 border-t border-slate-50 dark:border-slate-800">
                    <app-pagination 
                        [currentPage]="currentPage" 
                        [totalPages]="totalPages" 
                        [pageSize]="pageSize"
                        (pageChange)="onPageChange($event)" 
                        (pageSizeChange)="onPageSizeChange($event)">
                    </app-pagination>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Anulación -->
    <app-modal-anular-compra 
        *ngIf="showModalAnulacion" 
        [orden]="selectedOrden!"
        (onClose)="showModalAnulacion = false" 
        (onConfirm)="onAnulacionConfirmada()">
    </app-modal-anular-compra>
</div>
