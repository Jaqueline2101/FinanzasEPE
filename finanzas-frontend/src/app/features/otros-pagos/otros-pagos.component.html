<div class="min-h-screen bg-slate-50/50 pb-8 pt-6 animate-fadeIn">

    <!-- Breadcrumb -->
    <div class="px-4 sm:px-6 lg:px-8 mb-6">
        <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
    </div>

    <!-- Page Header -->
    <div class="px-4 sm:px-6 lg:px-8 mb-6">
        <app-page-header 
            title="Otros Pagos" 
            subtitle="Gestión y registro de pagos generales a beneficiarios" 
            icon="fas fa-file-invoice-dollar"
            [counterValue]="totalRecords" 
            counterLabel="Registros totales">
        </app-page-header>
    </div>

    <!-- Main Card -->
    <div class="px-4 sm:px-6 lg:px-8 pb-8">
        <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800 p-6 space-y-6">
            
            <!-- Barra de Filtros -->
            <app-barra-filtros 
                placeholder="Buscar por beneficiario o concepto..." 
                [searchOptions]="searchOptions"
                [estadoOptions]="estadoOptions"
                [showDates]="true"
                (onFilter)="onFilter($event)">
            </app-barra-filtros>

            <!-- Acción: Nuevo Pago -->
            <div class="flex justify-end gap-3 py-2">
                <button (click)="irAReportes()" 
                    class="px-6 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-black transition-all flex items-center gap-2 border border-slate-200">
                    <i class="fas fa-chart-bar"></i>
                    VER REPORTES
                </button>
                <app-primary-button 
                    label="NUEVO PAGO" 
                    icon="plus" 
                    color="brand"
                    size="lg"
                    (btnClick)="openModal()">
                </app-primary-button>
            </div>

            <!-- Tabla General -->
            <app-tabla-general 
                [datos]="datosPaginados" 
                [columnas]="columnas" 
                [loading]="loading" 
                [showEdit]="true"
                [showViewDetails]="true" 
                [showDelete]="true" 
                (onEdit)="editarPago($event)"
                (viewDetails)="verDetallePago($event)" 
                (onDelete)="anularPago($event)" 
                [currentPage]="currentPage"
                [pageSize]="pageSize">
            </app-tabla-general>

            <!-- Paginación -->
            <div class="p-4">
                <app-pagination 
                    [currentPage]="currentPage" 
                    [totalPages]="totalPages" 
                    [pageSize]="pageSize"
                    (pageChange)="onPageChange($event)" 
                    (pageSizeChange)="onPageSizeChange($event)">
                </app-pagination>
            </div>
        </div>
    </div>
</div>

<!-- Modal para Nuevo/Editar Pago -->
<app-modal-pagos [isOpen]="showModal" [currentUserId]="currentUserId" [currentSucursalId]="currentSucursalId"
    [paymentToEdit]="selectedPayment" (onClose)="closeModal()" (onSave)="onPagoGuardado()">
</app-modal-pagos>

<!-- Modal para Detalle -->
<app-modal-detalle [isOpen]="showDetalleModal" [payment]="selectedPayment" (onClose)="closeDetalleModal()">
</app-modal-detalle>

<app-alertas></app-alertas>
