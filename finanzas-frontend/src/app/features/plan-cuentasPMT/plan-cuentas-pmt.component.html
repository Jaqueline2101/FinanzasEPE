<div class="h-full bg-linear-to-br from-gray-50 to-blue-50 dark:from-slate-900 dark:to-slate-800 p-4 md:p-6 min-w-0 transition-all duration-300 ease-in-out">
  <!-- BREADCRUMB -->
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

  <!-- PAGE HEADER -->
  <div class="mb-3">
    <app-page-header title="Plan de cuentas (P. M. T.)" subtitle="Gestión de Proveedores, Médicos y Trabajadores"
      iconType="settings" [counterValue]="filteredRegistros.length">
    </app-page-header>
  </div>

  <!-- CONTENEDOR PRINCIPAL (CARD) -->
  <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-gray-100 dark:border-slate-700 p-6">
    <div class="space-y-6 animate-fadeIn">
      
      <!-- BARRA DE FILTROS -->
      <app-barra-filtros [searchOptions]="filterOptions" placeholder="Buscar por nombre o documento..."
        (onFilter)="handleFilters($event)">
      </app-barra-filtros>

      <!-- BOTÓN ACCIÓN -->
      <div class="flex justify-end">
        <button (click)="abrirNuevo()"
          class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl shadow-lg shadow-blue-500/30 transition-all flex items-center gap-2 text-sm font-bold active:scale-95">
          <i class="fas fa-plus"></i> Nuevo Registro
        </button>
      </div>

      <!-- TABLA PRINCIPAL -->
      <div class="overflow-hidden rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm">
        <app-tabla-general [datos]="paginatedRegistros" [columnas]="columnas" [loading]="loading" [showEdit]="true"
          [showDelete]="true" [showLinkAction]="false" [showViewDetails]="true" (onEdit)="onEdit($event)"
          (onDelete)="onDelete($event)" (viewDetails)="onViewDetails($event)">
        </app-tabla-general>
      </div>

      <!-- PAGINACIÓN -->
      <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [pageSize]="pageSize"
        (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
      </app-pagination>
    </div>
  </div>

  <!-- ACCOUNTS MODAL -->
  <app-modal-cuentas [isOpen]="isModalOpen" [registro]="selectedRegistro" (onSave)="guardar($event)"
    (onCancel)="onCancelForm()">
  </app-modal-cuentas>

  <!-- MODAL DE DETALLE (LECTURA) -->
  <app-modal-detalle [isOpen]="showDetailModal" [registro]="selectedRegistro" (onClose)="showDetailModal = false">
  </app-modal-detalle>

  <!-- DRAWER: SOLO PARA HISTORIAL -->
  <div *ngIf="showHistory" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-end">

    <div [@slideInOut] (click)="$event.stopPropagation()"
      class="bg-white dark:bg-slate-900 w-full max-w-2xl h-full shadow-2xl flex flex-col overflow-y-auto">

      <!-- HEADER DRAWER -->
      <div
        class="p-6 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-800/50">
        <h2 class="text-xl font-bold text-slate-800 dark:text-white">Historial de Movimientos</h2>
        <button (click)="showHistory = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-white">
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>

      <div class="p-8 flex-1">
        <!-- LINEA DE TIEMPO (HISTORY) -->
        <div
          class="space-y-8 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-300 before:to-transparent">
          <div *ngFor="let item of historial"
            class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
            <div
              class="flex items-center justify-center w-10 h-10 rounded-full border border-white bg-slate-300 text-slate-500 group-[.is-active]:bg-emerald-500 group-[.is-active]:text-emerald-50 shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2">
              <i class="fas" [ngClass]="item.accion.includes('Registro') ? 'fa-plus' : 'fa-check'"></i>
            </div>
            <div
              class="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm transition-all hover:shadow-md">
              <div class="flex items-center justify-between space-x-2 mb-1">
                <div class="font-bold text-slate-800 dark:text-slate-200">{{item.accion}}</div>
                <time class="font-medium text-xs text-blue-500">{{item.fecha | date:'shortDate'}}</time>
              </div>
              <div class="text-slate-500 dark:text-slate-400 text-sm mb-2">{{item.detalle}}</div>
              <div class="flex flex-col gap-1 text-[11px] font-mono bg-slate-50 dark:bg-slate-800/50 p-2 rounded">
                <span class="text-red-500">De: {{item.valorAnterior || '---'}}</span>
                <span class="text-emerald-500">A: {{item.valorNuevo}}</span>
              </div>
              <div class="mt-2 text-[10px] text-slate-400">Por: {{item.usuario}}</div>
            </div>
          </div>
          <div *ngIf="historial.length === 0" class="text-center py-12">
            <i class="fas fa-info-circle text-4xl text-slate-300 mb-4"></i>
            <p class="text-slate-500">No hay movimientos registrados para este perfil.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
