<app-modal [isOpen]="isOpen" (modalClose)="close()"
    [title]="isEditMode ? 'Editar Empleado' : 'Nuevo Empleado'" size="3xl" [showFooter]="false">

    <!-- Tabs -->
    <div class="flex border-b border-slate-200 mb-4">
        <button (click)="activeTab = 'general'"
            class="flex-1 py-2.5 text-sm font-semibold text-center border-b-2 transition-colors relative"
            [ngClass]="activeTab === 'general' ? 'border-blue-600 text-blue-700 bg-blue-50/50' : 'border-transparent text-slate-500 hover:text-slate-700'">
            Información General
        </button>
        <button (click)="activeTab = 'familia'" [disabled]="!isEditMode"
            class="flex-1 py-2.5 text-sm font-semibold text-center border-b-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            [ngClass]="activeTab === 'familia' ? 'border-blue-600 text-blue-700 bg-blue-50/50' : 'border-transparent text-slate-500 hover:text-slate-700'">
            Núcleo Familiar
        </button>
    </div>

    <!-- Body -->
    <div class="px-6 pb-6 bg-white" [formGroup]="form">

        <!-- Tab 1: General (Personal + Laboral) -->
        <div *ngIf="activeTab === 'general'" class="space-y-4 animate-in fade-in slide-in-from-bottom-2 duration-300">

            <!-- Sección Datos Personales -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-x-4 gap-y-3">
                
                <!-- Row 1 -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Tipo de Documento <span class="text-red-500">*</span></label>
                    <select formControlName="tipoDoc"
                        class="w-full h-9 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-500 outline-none">
                        <option value="DNI">DNI</option>
                        <option value="RUC">RUC</option>
                    </select>
                </div>

                <div class="relative">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Número de documento <span class="text-red-500">*</span></label>
                    <input type="text" formControlName="numdoc" [placeholder]="form.get('tipoDoc')?.value === 'DNI' ? '8 dígitos' : '11 dígitos'"
                        [maxlength]="form.get('tipoDoc')?.value === 'DNI' ? 8 : 11"
                        class="w-full h-9 pl-3 pr-10 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-500 outline-none"
                        [class.border-red-500]="form.get('numdoc')?.invalid && form.get('numdoc')?.touched">
                    <button type="button" (click)="buscarPorDni()" [disabled]="form.get('numdoc')?.invalid"
                        class="absolute right-2 top-[26px] text-slate-400 hover:text-blue-500 disabled:opacity-50">
                        <svg *ngIf="!validandoDni" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <svg *ngIf="validandoDni" class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                    <div *ngIf="dniRegistrado" class="text-[9px] text-red-600 font-bold mt-0.5 animate-pulse">¡YA REGISTRADO!</div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nombres <span class="text-red-500">*</span></label>
                    <input type="text" formControlName="nombre" placeholder="Nombres"
                        class="w-full h-9 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-500 outline-none">
                </div>

                <!-- Row 2 -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Apellido Paterno <span class="text-red-500">*</span></label>
                    <input type="text" formControlName="apepat" placeholder="Ape. Paterno"
                        class="w-full h-9 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Apellido Materno <span class="text-red-500">*</span></label>
                    <input type="text" formControlName="apemat" placeholder="Ape. Materno"
                        class="w-full h-9 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">F. Nacimiento <span class="text-red-500">*</span></label>
                    <input type="date" formControlName="nacfec"
                        class="w-full h-9 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-500 outline-none">
                </div>

                <!-- Row 3 -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Sexo <span class="text-red-500">*</span></label>
                    <select formControlName="sexo"
                        class="w-full h-9 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-500 outline-none">
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Dirección</label>
                    <input type="text" formControlName="direcc" placeholder="Dirección completa"
                        class="w-full h-9 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-500 outline-none">
                </div>

                <!-- Row 4 -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Teléfono</label>
                    <input type="text" formControlName="fono1" placeholder="Ej. 987654321"
                        class="w-full h-9 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-500 outline-none">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Email</label>
                    <input type="email" formControlName="email" placeholder="correo@ejemplo.com"
                        class="w-full h-9 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-500 outline-none"
                        [class.border-red-500]="emailRegistrado && form.get('email')?.touched">
                    <div *ngIf="emailRegistrado && form.get('email')?.touched" class="text-[9px] text-red-600 font-bold mt-0.5">EMAIL YA REGISTRADO</div>
                </div>

                <!-- Sección Formación Académica (Header) -->
                <div class="md:col-span-3 mt-2">
                    <div class="flex justify-between items-center border-b border-indigo-100 pb-1 mb-2">
                        <h4 class="text-xs font-bold text-indigo-700 flex items-center gap-2">
                            <span class="w-1 h-3 bg-indigo-500 rounded-full"></span>
                            Formación Académica
                        </h4>
                        <button type="button" (click)="agregarFormacion()"
                            class="text-[10px] font-bold text-blue-600 hover:text-blue-700 flex items-center gap-1 bg-blue-50 px-2 py-0.5 rounded transition-colors">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                            </svg>
                            Añadir profesión
                        </button>
                    </div>

                    <div formArrayName="formaciones" class="space-y-2">
                        <div *ngFor="let f of formaciones.controls; let i = index" [formGroupName]="i" 
                            class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end animate-in fade-in slide-in-from-top-1 duration-200">
                            
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Grado {{ i + 1 }}</label>
                                <select formControlName="gradoAcademico"
                                    class="w-full h-8 px-2 bg-slate-50 border border-slate-300 rounded text-xs focus:border-blue-500 outline-none">
                                    <option *ngFor="let g of gradosAcademicos" [value]="g">{{ g }}</option>
                                </select>
                            </div>

                            <div class="relative">
                                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Profesión {{ i + 1 }}</label>
                                <select formControlName="profesion"
                                    class="w-full h-8 px-2 bg-slate-50 border border-slate-300 rounded text-xs focus:border-blue-500 outline-none">
                                    <option *ngFor="let p of profesiones" [value]="p">{{ p }}</option>
                                </select>
                            </div>

                            <div class="flex gap-2 items-end">
                                <div class="flex-1" *ngIf="i === 0">
                                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Fecha Inicio <span class="text-red-500">*</span></label>
                                    <input type="date" [formControl]="$any(form).get('fechaIngreso')"
                                        class="w-full h-8 px-2 bg-slate-50 border border-slate-300 rounded text-xs focus:border-blue-500 outline-none">
                                </div>
                                <div class="flex-1" *ngIf="i > 0">
                                    <!-- Espacio vacío para mantener alineación -->
                                    <div class="h-8"></div>
                                </div>

                                <button type="button" (click)="eliminarFormacion(i)" *ngIf="formaciones.length > 1"
                                    class="h-8 w-8 flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-red-50 rounded transition-all">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Row: Fecha Fin, Centro Laboral, Modalidad -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Fecha Fin</label>
                    <input type="date" formControlName="fechaFin"
                        class="w-full h-9 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">SEDE</label>
                    <select formControlName="centroLabor"
                        class="w-full h-9 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-500 outline-none">
                        <option *ngFor="let s of sucursales" [value]="s.nombreSucursal">{{ s.nombreSucursal }}</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Modalidad</label>
                    <select formControlName="modalidadTrabajo"
                        class="w-full h-9 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-500 outline-none">
                        <option *ngFor="let m of modalidades" [value]="m">{{ m }}</option>
                    </select>
                </div>

                <!-- Row: Condición, Sueldo Base, Renovación/Estado -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Condición</label>
                    <select formControlName="tipoContrato"
                        class="w-full h-9 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-500 outline-none">
                        <option *ngFor="let c of condiciones" [value]="c">{{ c }}</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Sueldo Base <span class="text-red-500">*</span></label>
                    <input type="number" formControlName="sueldoBase" placeholder="0.00"
                        class="w-full h-9 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm font-black text-blue-700 focus:border-blue-500 outline-none shadow-sm">
                </div>

                <div class="flex items-center gap-4 pt-4">
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" formControlName="renovacion" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                        <span class="ml-2 text-[9px] font-bold text-slate-600 uppercase">Renovación: {{ form.get('renovacion')?.value ? 'Sí' : 'No' }}</span>
                    </label>

                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" formControlName="estado" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                        <span class="ml-2 text-[9px] font-bold text-slate-600 uppercase">Activo: {{ form.get('estado')?.value ? 'Sí' : 'No' }}</span>
                    </label>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                <button (click)="close()" class="px-4 py-2 text-slate-500 hover:text-slate-700 font-bold text-xs uppercase transition-colors">Cancelar</button>
                <button (click)="save()" [disabled]="loading || form.invalid || (dniRegistrado && !isEditMode) || (emailRegistrado && !isEditMode) || validandoDni || validandoEmail"
                    class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs uppercase rounded-lg shadow-lg disabled:opacity-50 transition-all">
                    {{ isEditMode ? 'Guardar Cambios' : 'Registrar Empleado' }}
                </button>
            </div>
        </div>

        <!-- Tab 2: Familia -->
        <div *ngIf="activeTab === 'familia'" class="space-y-4 animate-in fade-in slide-in-from-bottom-2 duration-300">
            <!-- El contenido de familia se mantiene igual pero optimizado -->
            <div *ngIf="!registrandoManual" class="bg-blue-50 rounded-xl p-4 flex gap-4 items-end">
                <div class="flex-1">
                    <label class="block text-[10px] font-bold text-blue-800 uppercase mb-1">DNI Familiar</label>
                    <input type="text" [(ngModel)]="nuevoFamiliarDni" [ngModelOptions]="{standalone: true}" maxlength="8"
                        class="w-full h-9 px-3 bg-white border border-blue-200 rounded-lg text-sm outline-none" placeholder="8 dígitos">
                </div>
                <div class="w-48">
                    <label class="block text-[10px] font-bold text-blue-800 uppercase mb-1">Parentesco</label>
                    <select [(ngModel)]="nuevoFamiliarParentesco" [ngModelOptions]="{standalone: true}"
                        class="w-full h-9 px-3 bg-white border border-blue-200 rounded-lg text-sm outline-none">
                        <option *ngFor="let p of parentescos" [value]="p.value">{{ p.label }}</option>
                    </select>
                </div>
                <button (click)="agregarFamiliar()" [disabled]="buscandoFamiliar" class="h-9 px-6 bg-blue-600 text-white text-xs font-bold uppercase rounded-lg shadow cursor-pointer">
                    {{ buscandoFamiliar ? '...' : '+ Añadir' }}
                </button>
            </div>

            <!-- Tabla de familiares -->
            <div class="border border-slate-200 rounded-xl overflow-hidden">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="px-4 py-2 font-bold text-slate-500 uppercase">Familiar</th>
                            <th class="px-4 py-2 font-bold text-slate-500 uppercase">Parentesco</th>
                            <th class="px-4 py-2 font-bold text-slate-500 uppercase text-right">Acción</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <tr *ngFor="let fam of familiares">
                            <td class="px-4 py-2 font-semibold text-slate-800">{{ fam.nombreFamiliar }}</td>
                            <td class="px-4 py-2"><span class="bg-slate-100 px-2 py-0.5 rounded text-[10px] font-bold uppercase">{{ fam.parentesco }}</span></td>
                            <td class="px-4 py-2 text-right"><button (click)="eliminarFamiliar(fam.id)" class="text-red-500 font-bold uppercase hover:underline">Eliminar</button></td>
                        </tr>
                        <tr *ngIf="familiares.length === 0"><td colspan="3" class="px-4 py-6 text-center text-slate-400">Sin familiares asociados</td></tr>
                    </tbody>
                </table>
            </div>
            
            <div class="flex justify-end pt-4">
                <button (click)="activeTab = 'general'" class="px-6 py-2 bg-slate-800 text-white font-bold text-xs uppercase rounded-lg">Volver a General</button>
            </div>
        </div>
    </div>
</app-modal>
