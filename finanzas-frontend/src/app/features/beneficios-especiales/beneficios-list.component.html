<div class="flex flex-col h-full p-6">
    <!-- Breadcrumb -->
    <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

    <!-- Page Header -->
    <app-page-header title="Beneficios Especiales" subtitle="Gestión de tarifas y descuentos especiales por servicio"
        iconType="settings">
    </app-page-header>

    <!-- Layout principal -->
    <div class="flex flex-1 gap-4 mt-6 min-h-0">

        <!-- Columna izquierda: botones + sidebar -->
        <div class="flex flex-col w-64 flex-shrink-0 gap-3">

            <!-- Botones de tipo -->
            <div class="flex flex-col gap-2">
                <button (click)="seleccionarTipo('GENERAL')"
                    class="w-full px-4 py-2.5 text-sm font-semibold rounded-lg shadow-sm transition-all text-left border"
                    [ngClass]="tipoSeleccionado === 'GENERAL' ? 'bg-[#1E293B] text-white border-[#1E293B]' : 'bg-white text-gray-700 border-gray-200 hover:bg-gray-50'">
                    Descuento General
                </button>
                <button (click)="seleccionarTipo('FAMILIAR')"
                    class="w-full px-4 py-2.5 text-sm font-semibold rounded-lg shadow-sm transition-all text-left border"
                    [ngClass]="tipoSeleccionado === 'FAMILIAR' ? 'bg-[#1E293B] text-white border-[#1E293B]' : 'bg-white text-gray-700 border-gray-200 hover:bg-gray-50'">
                    Descuento Familiar
                </button>
            </div>

            <!-- Sidebar -->
            <div
                class="flex-1 border border-gray-200 rounded-lg bg-white shadow-sm overflow-hidden flex flex-col min-h-0">
                <!-- Header -->
                <div
                    class="flex items-center justify-between px-3 py-2.5 border-b border-gray-200 bg-gray-50 flex-shrink-0">
                    <span class="text-sm font-semibold text-gray-700">
                        {{ tipoSeleccionado === 'FAMILIAR' ? 'Desc. Familiar' : 'Desc. General' }}
                    </span>
                    <button (click)="abrirModal()"
                        class="flex items-center gap-1 px-2 py-1 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded transition-colors">
                        + Nuevo
                    </button>
                </div>

                <!-- Lista con scroll -->
                <div class="flex-1 overflow-y-auto p-2">
                    <!-- Cargando -->
                    <div *ngIf="cargando" class="py-10 text-center text-xs text-gray-400">
                        Cargando...
                    </div>

                    <!-- Error -->
                    <div *ngIf="!cargando && errorCarga" class="py-6 px-3 text-center text-xs text-red-400">
                        {{ errorCarga }}
                    </div>

                    <!-- Sin registros -->
                    <div *ngIf="!cargando && !errorCarga && itemsActuales().length === 0"
                        class="py-10 text-center text-xs text-gray-400">
                        Sin registros
                    </div>

                    <!-- Items -->
                    <div *ngFor="let item of itemsActuales()"
                        class="relative flex items-center justify-between px-3 py-2.5 rounded-md cursor-pointer hover:bg-gray-50 transition-colors border-b border-gray-100 last:border-0"
                        [ngClass]="itemSeleccionado === item.idPlan ? 'bg-blue-50 border-blue-100' : ''"
                        (click)="seleccionarItem(item.idPlan)">

                        <!-- Info del item -->
                        <div class="flex-1 min-w-0 pr-2">
                            <p class="text-sm font-medium text-gray-800 truncate">{{ item.nombre }}</p>
                            <div class="flex items-center gap-2 mt-0.5">
                                <span class="text-xs text-gray-500 font-mono">{{ item.codigo }}</span>
                                <span class="text-xs px-1 rounded font-medium"
                                    [ngClass]="item.estado === '1' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'">
                                    {{ item.estado === '1' ? 'Activo' : 'Inactivo' }}
                                </span>
                            </div>
                        </div>

                        <!-- Botón tres puntos -->
                        <button
                            class="flex-shrink-0 p-1 rounded-md text-gray-400 hover:text-gray-700 hover:bg-gray-200 transition-colors"
                            (click)="toggleMenu(item.idPlan, $event)" title="Opciones">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24"
                                fill="currentColor">
                                <circle cx="12" cy="5" r="1.5" />
                                <circle cx="12" cy="12" r="1.5" />
                                <circle cx="12" cy="19" r="1.5" />
                            </svg>
                        </button>

                        <!-- Dropdown menu -->
                        <div *ngIf="menuAbierto === item.idPlan"
                            class="absolute right-0 top-full mt-1 z-50 w-44 bg-white border border-gray-200 rounded-xl shadow-xl overflow-hidden"
                            (click)="$event.stopPropagation()">

                            <button (click)="verDetalle(item); cerrarMenu()"
                                class="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-500" fill="none"
                                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                Ver detalle
                            </button>

                            <button (click)="editarItem(item); cerrarMenu()"
                                class="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-500" fill="none"
                                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" />
                                </svg>
                                Editar
                            </button>

                            <div class="border-t border-gray-100"></div>

                            <button (click)="eliminarItem(item); cerrarMenu()"
                                class="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M8 7V4a1 1 0 011-1h6a1 1 0 011 1v3" />
                                </svg>
                                Eliminar
                            </button>

                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Área de contenido principal -->
        <div class="flex-1 border border-gray-200 rounded-lg bg-white shadow-sm overflow-hidden">

            <!-- Sin selección -->
            <div *ngIf="!itemSeleccionadoObj()" class="h-full flex items-center justify-center">
                <div class="flex flex-col items-center text-center px-6">
                    <div class="w-14 h-14 bg-blue-50 rounded-full flex items-center justify-center mb-4">
                        <i class="fas fa-tags text-blue-400 text-xl"></i>
                    </div>
                    <p class="text-sm text-gray-500 max-w-sm leading-relaxed">
                        Seleccione un plan de la lista lateral para configurar sus descuentos.
                    </p>
                </div>
            </div>

            <!-- Panel de descuentos del plan seleccionado -->
            <div *ngIf="itemSeleccionadoObj()" class="h-full p-4 overflow-y-auto">
                <app-descuento-general [plan]="itemSeleccionadoObj()!"></app-descuento-general>
            </div>

        </div>

        <!-- ========== MODAL CREAR / EDITAR (componente extraído) ========== -->
        <app-modal-plan [tipoSeleccionado]="tipoSeleccionado" (planCreado)="onPlanCreado($event)"
            (planActualizado)="onPlanActualizado($event)">
        </app-modal-plan>

        <!-- ========== MODAL DETALLE (componente extraído) ========== -->
        <app-modal-detalle></app-modal-detalle>

    </div>
</div>
