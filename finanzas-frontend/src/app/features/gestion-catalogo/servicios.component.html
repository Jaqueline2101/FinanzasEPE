<div
    class="h-full bg-linear-to-br from-gray-50 to-blue-50 dark:from-slate-900 dark:to-slate-800 p-4 md:p-6 min-w-0 transition-all duration-300 ease-in-out">
    <app-breadcrumb [items]="breadcrumbItems" [showIcon]="true"></app-breadcrumb>

    <!-- Header Separado -->
    <div class="mb-3">
        <app-page-header title="Gestión Comercial y de Servicios"
            subtitle="Administra el catálogo de servicios, campañas promocionales, paquetes y convenios corporativos."
            [showCounter]="true" [counterLabel]="'Total'" [counterValue]="totalElements">
        </app-page-header>
    </div>

    <!-- Contenedor Principal (Card) -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-gray-100 dark:border-slate-700 p-6">

        <!-- Tab 1: Lista de Servicios -->
        <div *ngIf="activeTab === 'servicios'" class="h-full space-y-6">

            <!-- Barra de Filtros Compartida -->
            <app-barra-filtros [placeholder]="'Buscar servicio...'" [searchOptions]="searchOptions"
                [estadoOptions]="estadoOptions" (onFilter)="handleFilters($event)">
            </app-barra-filtros>

            <!-- Toolbar Actions (Nuevo Servicio) -->
            <div class="flex justify-end">
                <app-primary-button label="Nuevo Servicio" icon="plus" (btnClick)="openCreateModal()">
                </app-primary-button>
            </div>

            <!-- Data Table -->
            <div class="overflow-hidden rounded-xl border border-gray-200 dark:border-slate-700">
                <app-tabla-general [columnas]="columnas" [datos]="servicios" (onEdit)="editarServicio($event)"
                    [showEdit]="true" [showDelete]="true" [showViewDetails]="true" (onDelete)="deleteServicio($event)"
                    (viewDetails)="verResultados($event)">
                </app-tabla-general>
            </div>

            <!-- Pagination -->
            <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [pageSize]="pageSize"
                (pageChange)="onPageChange($event)">
            </app-pagination>

            <!-- Create/Edit Modal -->
            <app-modal-servicio [isVisible]="showModal" [servicio]="selectedServicio" (onClose)="closeModal()"
                (onSave)="onSaveSuccess()">
            </app-modal-servicio>

            <!-- Detail Modal -->
            <app-modal-detalle-servicio [isVisible]="showDetailModal" [servicio]="selectedServicio"
                (onClose)="closeDetailModal()">
            </app-modal-detalle-servicio>
        </div>
    </div>
</div>
