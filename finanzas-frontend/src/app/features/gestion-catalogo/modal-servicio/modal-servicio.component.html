<app-modal [isOpen]="isVisible" [title]="modalTitle" [size]="'xl'" [showFooter]="true" [closeOnBackdrop]="false"
  (modalClose)="close()">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Información General -->
    <div class="space-y-4">
      <h4 class="text-sm font-semibold text-slate-500 uppercase tracking-wider border-b pb-2">
        Información General
      </h4>

      <div>
        <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">Nombre del Catalogo<span
            class="text-rose-500 text-xl leading-none">*</span></label>
        <input type="text" [(ngModel)]="formData.nombreServicio"
          class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-400"
          placeholder="Consulta Médica General" />
      </div>

      <!-- Fila alineada: Tipo Atención (Siempre visible ya que es un Servicio) -->
      <div class="grid grid-cols-1 gap-4">
        <!-- Tipo Atención -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Tipo Atención</label>
          <select [(ngModel)]="formData.idTipoAtencion"
            class="w-full px-3 py-2.5 border border-slate-300 rounded-lg bg-white text-slate-700 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all cursor-pointer appearance-none">
            <option [ngValue]="null">TODOS</option>
            <option *ngFor="let tipo of tiposAtencion" [value]="tipo.id">
              {{ tipo.nombre }}
            </option>
          </select>
        </div>
      </div>

      <!-- Código -->
      <div>
        <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">Código<span
            class="text-rose-500 text-xl leading-none">*</span></label>
        <input type="text" [(ngModel)]="formData.codigo"
          class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-400 placeholder:text-xs"
          placeholder="00000001, 00000002, 00000003" />
      </div>

      <!-- Categoría (Familia) -->
      <div>
        <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">Categoría (Seleccionar
          Familia)</label>
        <select [(ngModel)]="formData.idCategoria"
          class="w-full px-3 py-2.5 border border-slate-300 rounded-lg bg-white text-slate-700 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all cursor-pointer appearance-none">
          <option [ngValue]="null">Seleccionar familia...</option>
          <option *ngFor="let cat of categorias" [ngValue]="cat.id">
            {{ cat.nombre }}
          </option>
        </select>
      </div>

      <!-- Codificación -->
      <div>
        <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">Codificación<span
            class="text-rose-500 text-xl leading-none">*</span></label>
        <div class="flex gap-2">
          <select [(ngModel)]="categoryMode"
            class="w-40 px-2 py-2 border border-slate-300 rounded-lg bg-white text-slate-700 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 cursor-pointer">
            <option value="SEUS">Cód. SEUS</option>
            <option value="DIGEMID">Reg. DIGEMID</option>
          </select>
          <input *ngIf="categoryMode === 'SEUS'" type="text" [(ngModel)]="formData.codigoSeus"
            class="flex-1 px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-400 placeholder:text-xs"
            placeholder="Ej: L001" />
          <input *ngIf="categoryMode === 'DIGEMID'" type="text" [(ngModel)]="formData.regSanitario"
            class="flex-1 px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-400 placeholder:text-xs"
            placeholder="Ej: N-0000" />
        </div>
      </div>

      <!-- Nivel Selector Sub-component -->
      <app-nivel-selector 
        [(value)]="formData.idNivel" 
        [label]="'Nivel'" 
        [required]="true">
      </app-nivel-selector>

    </div>

    <!-- Precios y Configuración -->
    <div class="space-y-4">
      <h4 class="text-sm font-semibold text-slate-500 uppercase tracking-wider border-b pb-2">
        Precios y Configuración
      </h4>

      <!-- Moneda -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Moneda</label>
        <div class="flex gap-4">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="moneda" [(ngModel)]="formData.moneda" value="PEN"
              class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500" />
            <span class="text-sm text-slate-700 font-medium">Soles (S/)</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="moneda" [(ngModel)]="formData.moneda" value="USD"
              class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500" />
            <span class="text-sm text-slate-700 font-medium">Dólares ($)</span>
          </label>
        </div>
      </div>

      <!-- Pricing Config Sub-component -->
      <app-pricing-config
        [tipo]="formData.tipo"
        [tipoPrecio]="formData.tipoPrecio"
        [precioCompra]="formData.precioCompra"
        [margenGanancia]="formData.margenGanancia"
        [precioConIgv]="formData.precioConIgv"
        [precioSinIgv]="formData.precioSinIgv"
        [moneda]="formData.moneda"
        (onChange)="onPricingChange($event)">
      </app-pricing-config>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">Unidad<span
              class="text-rose-500 text-lg leading-none">*</span></label>
          <input type="number" [(ngModel)]="formData.unidad"
            class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" />
        </div>
        <div>
          <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">Tipo Unidad<span
              class="text-rose-500 text-lg leading-none">*</span></label>
          <input type="text" [(ngModel)]="formData.tipoUnidad" placeholder="U.V.T., Galenos"
            class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-400" />
        </div>
      </div>

      <div class="flex flex-col gap-3 pt-2">
        <label class="flex items-center gap-2 cursor-pointer group">
          <input type="checkbox" [(ngModel)]="formData.honorariosMedicos"
            class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 transition-all" />
          <span class="text-sm text-slate-700 group-hover:text-slate-900 transition-colors">Incluye Honorarios
            Médicos</span>
        </label>

        <label class="flex items-center gap-2 cursor-pointer group">
          <input type="checkbox" [ngModel]="formData.estado === 1" (ngModelChange)="formData.estado = $event ? 1 : 0"
            class="w-4 h-4 text-green-600 rounded border-slate-300 focus:ring-green-500 transition-all" />
          <span class="text-sm text-slate-700 group-hover:text-slate-900 transition-colors">Estado Activo</span>
        </label>
      </div>
    </div>
  </div>

  <div footer class="w-full flex justify-end gap-3">
    <button (click)="close()"
      class="px-4 py-2 bg-white border border-slate-300 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-50 transition-all">
      Cancelar
    </button>
    <button (click)="save()"
      class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 shadow-md shadow-blue-500/20 transition-all flex items-center gap-2">
      <svg *ngIf="!isEditMode" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <svg *ngIf="isEditMode" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
      {{ isEditMode ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>

</app-modal>
