<div class="h-full bg-linear-to-br from-gray-50 to-blue-50 dark:from-slate-900 dark:to-slate-800 p-4 md:p-6 min-w-0 transition-all duration-300 ease-in-out">

    <!-- Breadcrumb -->
    <div class="mb-3">
        <app-breadcrumb [items]="breadcrumbItems" [showIcon]="true" [showBackButton]="true"></app-breadcrumb>
    </div>

    <!-- Header -->
    <div class="mb-3">
        <app-page-header 
            title="Reporte de Comprobantes Anulados" 
            subtitle="Listado detallado de todos los documentos anulados en el sistema." 
            [showCounter]="true" 
            [counterValue]="totalElements">
        </app-page-header>
    </div>

    <!-- Resumen de Totales -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-red-50 dark:bg-red-900/20 flex items-center justify-center text-red-600">
                <i class="fa-solid fa-file-circle-xmark text-2xl"></i>
            </div>
            <div>
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Anulado</p>
                <p class="text-2xl font-bold text-slate-800 dark:text-white">S/ {{ totalAnulado | number:'1.2-2' }}</p>
            </div>
        </div>
        
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center text-blue-600">
                <i class="fa-solid fa-hashtag text-2xl"></i>
            </div>
            <div>
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Cantidad Documentos</p>
                <p class="text-2xl font-bold text-slate-800 dark:text-white">{{ totalElements }}</p>
            </div>
        </div>
    </div>

    <!-- CARD PRINCIPAL (Filtros + Tabla + Paginación) -->
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden p-4 md:p-6">
        
        <!-- Barra de Filtros -->
        <div class="mb-6">
            <app-barra-filtros 
                [searchOptions]="searchOptions"
                [showStatus]="false" 
                [showDates]="true"
                [initialDesde]="filtros.fechaInicio"
                [initialHasta]="filtros.fechaFin"
                (onFilter)="onFilter($event)">
            </app-barra-filtros>
        </div>

        <!-- Tabla -->
        <app-tabla-general 
            [datos]="datos" 
            [columnas]="columnas" 
            [loading]="isLoading"
            [showIndex]="true"
            [showActions]="false"
            [currentPage]="paginaActual"
            [pageSize]="tamanoPagina">
        </app-tabla-general>

        <!-- Paginación -->
        <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-700">
            <app-pagination 
                [currentPage]="paginaActual" 
                [pageSize]="tamanoPagina" 
                [totalPages]="totalPages"
                (pageChange)="onPageChange($event)" 
                (pageSizeChange)="onPageSizeChange($event)">
            </app-pagination>
        </div>

    </div>
</div>
