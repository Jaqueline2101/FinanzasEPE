<div class="space-y-4">
    <div class="flex justify-between items-center gap-4">

        <!-- Search Component (Replaces Title) -->
        <div class="flex-1 max-w-lg">
            <app-search-generic [options]="searchOptions" [placeholder]="'Buscar planes...'"
                (onSearch)="handleSearch($event)">
            </app-search-generic>
        </div>

        <button (click)="openLinkModal()"
            class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors flex items-center gap-2 shrink-0">
            <i class="fas fa-plus-circle"></i> Crear Planes
        </button>
    </div>

    <!-- Bulk Actions Row -->
    <div class="flex flex-wrap items-center justify-end gap-3 bg-gray-50/50 p-2 rounded-xl border border-gray-100">
        <div class="flex items-center gap-2">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Desc. Fijo:</label>
            <div class="relative max-w-[100px]">
                <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs">S/</span>
                <input type="number" [(ngModel)]="descuentoFijo" (ngModelChange)="onDescuentoValueChange('FIJO')"
                    placeholder="0.00"
                    class="w-full pl-7 pr-2 py-1.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm font-bold text-blue-600">
            </div>
        </div>

        <div class="flex items-center gap-2 border-l border-gray-200 pl-3">
            <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Desc. %:</label>
            <div class="relative max-w-[80px]">
                <input type="number" [(ngModel)]="descuentoPorcentaje"
                    (ngModelChange)="onDescuentoValueChange('PORCENTAJE')" placeholder="0"
                    class="w-full pr-6 pl-2 py-1.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm font-bold text-blue-600">
                <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs">%</span>
            </div>
        </div>

        <div class="flex items-center gap-2 ml-auto">
            <button (click)="seleccionarTodoBoton()"
                class="px-3 py-1.5 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-xs font-bold rounded-lg transition-all shadow-sm">
                <i class="fas fa-check-double mr-1.5"></i> Seleccionar todo
            </button>
            <button (click)="aplicarDescuentoMasivo()" [disabled]="isApplyingBulk"
                class="px-4 py-1.5 bg-green-600 hover:bg-green-700 text-white text-xs font-bold rounded-lg transition-all shadow-md shadow-green-100 flex items-center gap-2 disabled:opacity-50">
                <i class="fas fa-magic" [class.fa-spin]="isApplyingBulk"></i>
                {{ isApplyingBulk ? 'Procesando...' : 'Aplicar' }}
            </button>
        </div>
    </div>

    <!-- Tabla General Component (Uses paginatedData) -->
    <app-tabla-general [datos]="paginatedData" [columnas]="columnas" [showEdit]="true" [showDelete]="true"
        (onEdit)="openEditModal($event)" (onDelete)="eliminar($event)" (onLinkAction)="handleLinkAction($event)"
        (onCheckboxChange)="onCheckboxChange($event)" (onHeaderCheckboxChange)="toggleTodos($event)">
    </app-tabla-general>

    <!-- Pagination Component -->
    <app-pagination *ngIf="empresasTableData.length > 0" [currentPage]="currentPage" [totalPages]="totalPages"
        [pageSize]="pageSize" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination>

    <div *ngIf="!loading && empresasTableData.length === 0"
        class="text-center py-8 text-gray-500 bg-gray-50 rounded-lg border border-dashed border-gray-200">
        No hay empresas vinculadas.
    </div>

</div>

<!-- Modal de Vinculación (Refactored) -->
<app-modal-vincular-emp *ngIf="showLinkModal" [companiaId]="companiaId" [existingLinkedIds]="getLinkedIds()"
    (onClose)="closeLinkModal()" (onVinculacionExitosa)="onVinculacionExitosa()">
</app-modal-vincular-emp>

<!-- Modal de Edición (Standardized with app-modal) -->
<app-modal [isOpen]="showEditModal" (modalClose)="closeEditModal()" 
    title="Actualizar Plan" 
    iconType="edit"
    size="md"
    [showFooter]="true">
    
    <div class="space-y-4">
        <!-- Read-only Company Info -->
        <div class="p-3 bg-blue-50 border border-blue-100 rounded-lg flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 shrink-0">
                <i class="fas fa-building"></i>
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-[10px] uppercase font-bold text-blue-600 tracking-wider">Empresa</p>
                <p class="text-sm font-bold text-gray-900 truncate">{{ editingPlan.nombreEmpresa }}</p>
                <p class="text-xs text-blue-500 truncate">{{ editingPlan.ruc }}</p>
            </div>
        </div>

        <form id="editPlanForm" (ngSubmit)="saveEdit()" class="grid grid-cols-2 gap-4">
            <div class="col-span-1">
                <label class="block text-xs font-semibold text-slate-700 mb-1">Código del Plan <span class="text-rose-500">*</span></label>
                <input type="text" [(ngModel)]="editingPlan.codigo" name="codigo" required placeholder="Ej. PLAN-001"
                    class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm">
            </div>
            <div class="col-span-1">
                <label class="block text-xs font-semibold text-slate-700 mb-1">Estado <span class="text-rose-500">*</span></label>
                <select [(ngModel)]="editingPlan.estado" name="estado" required
                    class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm">
                    <option value="1">Activo</option>
                    <option value="0">Inactivo</option>
                </select>
            </div>
            <div class="col-span-2">
                <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre de Plan <span class="text-rose-500">*</span></label>
                <input type="text" [(ngModel)]="editingPlan.nombre" name="nombre" required placeholder="Nombre descriptivo del plan"
                    class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm">
            </div>

            <div class="col-span-1">
                <label class="block text-xs font-semibold text-slate-700 mb-1">Fecha Inicio <span class="text-rose-500">*</span></label>
                <input type="date" [(ngModel)]="editingPlan.fechaInicio" name="fechaInicio" required
                    class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm">
            </div>
            <div class="col-span-1">
                <label class="block text-xs font-semibold text-slate-700 mb-1">Fecha Fin</label>
                <input type="date" [(ngModel)]="editingPlan.fechaFin" name="fechaFin"
                    class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm">
            </div>

            <!-- Sección de Seguro Médico -->
            <div class="col-span-2 pt-2 border-t border-slate-100">
                <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                    <i class="fas fa-hand-holding-medical"></i> Configuración de Seguro Médico
                </h4>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Copago Fijo</label>
                        <div class="relative">
                            <span class="absolute left-2 top-1/2 -translate-y-1/2 text-slate-400 text-xs">S/</span>
                            <input type="number" [(ngModel)]="editingPlan.copago" name="copago" placeholder="0.00"
                                class="w-full pl-6 pr-2 py-1.5 border border-slate-200 rounded-xl text-sm font-bold text-indigo-600 focus:ring-2 focus:ring-indigo-500/20">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Deducible</label>
                        <div class="relative">
                            <span class="absolute left-2 top-1/2 -translate-y-1/2 text-slate-400 text-xs">S/</span>
                            <input type="number" [(ngModel)]="editingPlan.deducible" name="deducible" placeholder="0.00"
                                class="w-full pl-6 pr-2 py-1.5 border border-slate-200 rounded-xl text-sm font-bold text-orange-600 focus:ring-2 focus:ring-orange-500/20">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Coaseguro %</label>
                        <div class="relative">
                            <input type="number" [(ngModel)]="editingPlan.porcentajeCoaseguro" name="coaseguro" placeholder="0"
                                class="w-full pr-6 pl-2 py-1.5 border border-slate-200 rounded-xl text-sm font-bold text-emerald-600 focus:ring-2 focus:ring-emerald-500/20">
                            <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs">%</span>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- Footer buttons -->
    <div footer class="flex justify-end gap-3 w-full">
        <button type="button" (click)="closeEditModal()"
            class="px-5 py-2 text-sm font-semibold text-slate-600 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition-all duration-200">
            Cancelar
        </button>
        <button type="submit" form="editPlanForm"
            [disabled]="!editingPlan.nombre || !editingPlan.codigo || !editingPlan.fechaInicio"
            class="px-6 py-2 text-sm font-bold text-white bg-blue-600 rounded-xl hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-blue-200 transition-all duration-200 flex items-center gap-2">
            <i class="fas fa-save"></i>
            Actualizar Plan
        </button>
    </div>
</app-modal>
