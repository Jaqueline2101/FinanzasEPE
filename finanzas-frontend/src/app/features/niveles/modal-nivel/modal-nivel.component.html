<app-modal [isOpen]="showModal" [title]="getTituloModal()" size="lg" iconType="document" [closeOnBackdrop]="false" (modalClose)="close()">
    <form (ngSubmit)="save()" class="space-y-6">
        <!-- INFO: Mostrar mensaje informativo si es nivel hijo -->
        <div *ngIf="esNivelHijo()" class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-lg">
            <div class="flex items-start">
                <svg class="w-5 h-5 text-blue-500 mt-0.5 mr-3 flex-shrink-0" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <div>
                    <h4 class="text-sm font-bold text-blue-800 mb-1">Creando Subnivel</h4>
                    <p class="text-xs text-blue-700">
                        El código se generará automáticamente basándose en el nivel padre:
                        <span class="font-black bg-blue-100 px-2 py-0.5 rounded">{{
                            formData.nombrePadre
                            }}</span>
                    </p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- NOMBRE (Siempre visible) -->
            <div class="md:col-span-2">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2 ml-1">
                    Nombre <span class="text-rose-500 text-xl align-middle leading-none">*</span>
                </label>
                <input type="text" [(ngModel)]="formData.nombre" name="nombre" required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1E293B] focus:border-[#1E293B] focus:bg-white transition-all text-slate-800 font-medium placeholder:text-slate-400"
                    placeholder="Ejemplo: CONSULTA EXTERNA" />
            </div>

            <!-- CÓDIGO (Solo visible en niveles RAÍZ o modo EDICIÓN) -->
            <div *ngIf="!esNivelHijo() || isEditMode"
                [ngClass]="esNivelRaiz() && !isEditMode ? 'md:col-span-1' : 'md:col-span-2'">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2 ml-1">
                    {{ isEditMode ? 'Código (No editable)' : 'Código' }}
                    <span *ngIf="!isEditMode && esNivelRaiz()" class="text-rose-500 text-xl align-middle leading-none">*</span>
                </label>
                <div class="relative">
                    <input type="text" [(ngModel)]="formData.numNivel" name="numNivel"
                        [required]="!isEditMode && esNivelRaiz()" [disabled]="isEditMode"
                        [placeholder]="getPlaceholderCodigo()" pattern="[0-9]*" maxlength="50"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1E293B] focus:border-[#1E293B] focus:bg-white transition-all text-slate-800 font-medium placeholder:text-slate-400"
                        [ngClass]="{ 'bg-slate-100 cursor-not-allowed': isEditMode }" />
                    <div *ngIf="!isEditMode && esNivelRaiz()" class="absolute right-3 top-1/2 -translate-y-1/2">
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14" />
                        </svg>
                    </div>
                </div>
                <p *ngIf="!isEditMode && esNivelRaiz()" class="text-xs text-slate-500 mt-1.5 ml-1">
                    Solo números. Ejemplo: 100, 200, 300
                </p>
                <p *ngIf="isEditMode" class="text-xs text-amber-600 mt-1.5 ml-1 flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                    El código no se puede modificar después de crear el nivel
                </p>
            </div>

            <!-- CENTRO DE COSTOS (Solo visible en niveles RAÍZ - nueva columna) -->
            <div *ngIf="esNivelRaiz() && !isEditMode" class="md:col-span-1">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2 ml-1">
                    Centro de Costo <span class="text-rose-500 text-xl align-middle leading-none">*</span>
                </label>
                <input type="text" [(ngModel)]="formData.centroCosto" name="centroCosto"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1E293B] focus:border-[#1E293B] focus:bg-white transition-all text-slate-800 font-medium placeholder:text-slate-400"
                    placeholder="Ejemplo: CC-001" />
                <p class="text-xs text-slate-500 mt-1.5 ml-1">Identificador del centro de costos</p>
            </div>

            <!-- TIPO DE ESTRUCTURA -->
            <div [ngClass]="esNivelRaiz() && !isEditMode ? 'md:col-span-1' : 'md:col-span-2'">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2 ml-1">
                    Nivel
                </label>
                <select [(ngModel)]="formData.tipo" name="tipo"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1E293B] focus:border-[#1E293B] focus:bg-white transition-all text-slate-800 font-medium appearance-none cursor-pointer">
                    <option value="" class="text-slate-400">Seleccione...</option>
                    <option *ngFor="let tipo of tiposArea" [value]="tipo.codigo">
                        {{ tipo.nombre }}
                    </option>
                </select>
            </div>

            <!-- ID TIPO ATE (opcional, en misma fila con Tipo si es hijo) -->
            <div *ngIf="!esNivelRaiz() || isEditMode" class="md:col-span-1">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2 ml-1">
                    ID Tipo ATE
                </label>
                <input type="text" [(ngModel)]="formData.idTipoAte" name="idTipoAte"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1E293B] focus:border-[#1E293B] focus:bg-white transition-all text-slate-800 font-medium placeholder:text-slate-400"
                    placeholder="Opcional" />
            </div>

            <!-- ESTADO -->
            <div class="md:col-span-2">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2 ml-1">
                    Estado
                </label>
                <div class="flex gap-4">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" [(ngModel)]="formData.estado" name="estado" [value]="1" class="hidden peer" />
                        <div
                            class="p-3 text-center rounded-xl border-2 border-slate-100 bg-slate-50 text-slate-400 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 font-bold transition-all">
                            Activo
                        </div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" [(ngModel)]="formData.estado" name="estado" [value]="0" class="hidden peer" />
                        <div
                            class="p-3 text-center rounded-xl border-2 border-slate-100 bg-slate-50 text-slate-400 peer-checked:border-rose-500 peer-checked:bg-rose-50 peer-checked:text-rose-700 font-bold transition-all">
                            Inactivo
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <div footer class="flex justify-end gap-3 w-full">
            <button type="button" (click)="close()"
                class="px-6 py-2.5 rounded-xl text-slate-500 font-bold border-2 border-slate-200 hover:bg-slate-100 transition-all uppercase text-xs tracking-widest">
                Cancelar
            </button>
            <button type="submit"
                class="px-8 py-2.5 bg-[#1E293B] text-white font-black rounded-xl hover:bg-[#0F172A] transition-all shadow-lg shadow-slate-200 uppercase text-xs tracking-widest active:scale-95">
                {{ isEditMode ? 'Actualizar' : 'Guardar' }}
            </button>
        </div>
    </form>
</app-modal>
