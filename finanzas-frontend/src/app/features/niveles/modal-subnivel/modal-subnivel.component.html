<app-modal [isOpen]="showModal" [title]="'Nuevo Subnivel de ' + (formData.nombrePadre || '')" size="lg"
    iconType="document" [closeOnBackdrop]="false" (modalClose)="close()">
    <form (ngSubmit)="save()" class="space-y-6">
        <!-- INFO: Mensaje informativo fijo para subniveles -->
        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-lg">
            <div class="flex items-start">
                <svg class="w-5 h-5 text-blue-500 mt-0.5 mr-3 flex-shrink-0" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <div>
                    <h4 class="text-sm font-bold text-blue-800 mb-1">Creando Subnivel</h4>
                    <p class="text-xs text-blue-700">
                        El código se generará automáticamente basándose en el nivel padre:
                        <span class="font-black bg-blue-100 px-2 py-0.5 rounded">{{ formData.nombrePadre }}</span>
                    </p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- NOMBRE -->
            <div class="md:col-span-2">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2 ml-1">
                    Nombre <span class="text-rose-500 text-xl align-middle leading-none">*</span>
                </label>
                <input type="text" [(ngModel)]="formData.nombre" name="nombre" required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1E293B] focus:border-[#1E293B] focus:bg-white transition-all text-slate-800 font-medium placeholder:text-slate-400"
                    placeholder="Ejemplo: CONSULTA EXTERNA" />
            </div>

            <!-- ID TIPO ATE -->
            <div class="md:col-span-1">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2 ml-1">
                    ID Tipo ATE <span class="text-rose-500 text-xl align-middle leading-none">*</span>
                </label>
                <input type="text" [(ngModel)]="formData.idTipoAte" name="idTipoAte"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1E293B] focus:border-[#1E293B] focus:bg-white transition-all text-slate-800 font-medium placeholder:text-slate-400"
                    placeholder="Opcional" />
            </div>

            <!-- ESTADO -->
            <div class="md:col-span-2">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-2 ml-1">
                    Estado
                </label>
                <div class="flex gap-4">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" [(ngModel)]="formData.estado" name="estado" [value]="1" class="hidden peer" />
                        <div
                            class="p-3 text-center rounded-xl border-2 border-slate-100 bg-slate-50 text-slate-400 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 font-bold transition-all">
                            Activo
                        </div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" [(ngModel)]="formData.estado" name="estado" [value]="0" class="hidden peer" />
                        <div
                            class="p-3 text-center rounded-xl border-2 border-slate-100 bg-slate-50 text-slate-400 peer-checked:border-rose-500 peer-checked:bg-rose-50 peer-checked:text-rose-700 font-bold transition-all">
                            Inactivo
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <div footer class="flex justify-end gap-3 w-full">
            <button type="button" (click)="close()"
                class="px-6 py-2.5 rounded-xl text-slate-500 font-bold border-2 border-slate-200 hover:bg-slate-100 transition-all uppercase text-xs tracking-widest">
                Cancelar
            </button>
            <button type="submit"
                class="px-8 py-2.5 bg-[#1E293B] text-white font-black rounded-xl hover:bg-[#0F172A] transition-all shadow-lg shadow-slate-200 uppercase text-xs tracking-widest active:scale-95">
                Guardar
            </button>
        </div>
    </form>
</app-modal>
