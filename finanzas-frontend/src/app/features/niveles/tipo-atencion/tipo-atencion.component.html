<div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-gray-100 dark:border-slate-700 p-4">
    <div class="flex justify-between items-center mb-4">
        <h3
            class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider flex items-center gap-2">
            <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            Tipos de Atención
        </h3>
        <button (click)="openCreateModal()"
            class="p-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all shadow-md shadow-blue-500/20 active:scale-95">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
            </svg>
        </button>
    </div>

    <div class="overflow-x-auto min-h-[200px]">
        <table class="w-full text-left border-separate border-spacing-y-2">
            <thead>
                <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-4">
                    <th class="pb-2 pl-4">Código</th>
                    <th class="pb-2">Nombre</th>
                    <th class="pb-2">Estado</th>
                    <th class="pb-2 text-right pr-4">Acciones</th>
                </tr>
            </thead>
            <tbody class="space-y-2">
                <tr *ngFor="let tipo of tiposAtencion"
                    class="group bg-slate-50 dark:bg-slate-900/50 hover:bg-white dark:hover:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-xl transition-all duration-300">
                    <td class="py-3 pl-4">
                        <span
                            class="px-2 py-0.5 text-[10px] font-bold bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 rounded-md border border-blue-100 dark:border-blue-800">
                            {{tipo.codigo}}
                        </span>
                    </td>
                    <td class="py-3 text-xs font-semibold text-slate-700 dark:text-slate-300">
                        {{tipo.nombre}}
                    </td>
                    <td class="py-3">
                        <span
                            [ngClass]="tipo.estado === 1 ? 'bg-emerald-50 text-emerald-700 border-emerald-100' : 'bg-rose-50 text-rose-700 border-rose-100'"
                            class="px-2 py-0.5 text-[10px] font-bold rounded-full border">
                            {{tipo.estado === 1 ? 'ACTIVO' : 'INACTIVO'}}
                        </span>
                    </td>
                    <td class="py-3 text-right pr-4">
                        <div class="flex justify-end gap-1">
                            <button (click)="openEditModal(tipo)"
                                class="p-1 text-slate-400 hover:text-amber-600 transition-colors">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path
                                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                                        stroke-width="2.5" />
                                </svg>
                            </button>
                            <button (click)="delete(tipo)"
                                class="p-1 text-slate-400 hover:text-rose-600 transition-colors">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                                        stroke-width="2.5" />
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        <div *ngIf="tiposAtencion.length === 0" class="text-center py-8 text-slate-400 text-xs italic">
            No hay tipos de atención registrados
        </div>
    </div>
</div>

<!-- Modal Tipo Atención -->
<app-modal [isOpen]="showModal" [title]="isEditMode ? 'Actualizar' : 'Nuevo'" size="sm" [showFooter]="true"
    [closeOnBackdrop]="false" (modalClose)="closeModal()">
    <form (ngSubmit)="save()" class="space-y-4">
        <div>
            <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">Código<span class="text-rose-500 text-xl leading-none">*</span></label>
            <input type="text" [(ngModel)]="formData.codigo" name="codigo"
                class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 transition-all uppercase"
                placeholder="AMB, HOSP, EMG">
        </div>
        <div>
            <label class="flex items-center gap-1 text-sm font-medium text-slate-700 mb-1">Nombre<span class="text-rose-500 text-xl leading-none">*</span></label>
            <input type="text" [(ngModel)]="formData.nombre" name="nombre"
                class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 transition-all"
                placeholder="Ejemplo: AMBULATORIO">
        </div>
        <div>
            <label class="block text-[10px] font-black text-slate-500 uppercase mb-1 ml-1">Orden</label>
            <input type="number" [(ngModel)]="formData.orden" name="orden"
                class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 transition-all">
        </div>
        <div>
            <label class="block text-[10px] font-black text-slate-500 uppercase mb-1 ml-1">Estado</label>
            <select [(ngModel)]="formData.estado" name="estado"
                class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500">
                <option [value]="1">ACTIVO</option>
                <option [value]="0">INACTIVO</option>
            </select>
        </div>

        <div footer class="flex justify-end gap-2 w-full">
            <button type="button" (click)="closeModal()"
                class="px-6 py-2.5 rounded-xl text-slate-500 font-bold border border-slate-200 hover:bg-slate-100 transition-all uppercase text-xs tracking-widest">
                Cancelar
            </button>
            <button type="submit"
                class="px-5 py-2 bg-blue-600 text-white text-[10px] font-black rounded-lg uppercase tracking-widest shadow-md shadow-blue-500/20 active:scale-95 hover:bg-blue-700 transition-all">
                {{ isEditMode ? 'Actualizar' : 'Guardar' }}
            </button>
        </div>
    </form>
</app-modal>
