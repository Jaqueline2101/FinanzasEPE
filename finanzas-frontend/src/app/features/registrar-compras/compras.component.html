<div class="min-h-screen bg-slate-50/50 pb-8 pt-6">

    <!-- Breadcrumb -->
    <div class="px-4 sm:px-6 lg:px-8 mb-2">
        <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
    </div>

    <!-- Header -->
    <div class="px-4 sm:px-6 lg:px-8">
        <app-page-header title="Gestión de Compras" subtitle="Registro y control de compras a proveedores"
            [showCounter]="true" counterLabel="Total" [counterValue]="totalElements">
        </app-page-header>
    </div>

    <!-- Contenedor Principal (Card) -->
    <div class="px-4 sm:px-6 lg:px-8 mt-8 relative z-10">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-gray-100 dark:border-slate-700 p-6">
            
            <div class="space-y-6">
                <!-- Barra de Filtros Modernizada -->
                <app-barra-filtros 
                    placeholder="Buscar por serie, número o proveedor..." 
                    [searchOptions]="searchOptions"
                    [estadoOptions]="estadoOptions"
                    (onFilter)="handleFilters($event)">
                </app-barra-filtros>

                <!-- Toolbar Actions (Nueva Compra) -->
                <div class="flex justify-end">
                    <app-primary-button label="Nueva Compra" icon="plus" (btnClick)="onNew()">
                    </app-primary-button>
                </div>

                <!-- Data Table -->
                <div class="overflow-hidden rounded-xl border border-gray-200 dark:border-slate-700">
                    <app-tabla-general [columnas]="columnas" [datos]="compras" [loading]="loading" [showViewDetails]="true"
                        [showEdit]="false" [showDelete]="false" (viewDetails)="onViewDetails($event)">
                    </app-tabla-general>
                </div>

                <!-- Pagination -->
                <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChange)="onPageChange($event)">
                </app-pagination>
            </div>

        </div>
    </div>
</div>
