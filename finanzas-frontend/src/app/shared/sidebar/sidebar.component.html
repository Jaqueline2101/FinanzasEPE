<div *ngIf="sidebarService.isOpen$ | async" (click)="sidebarService.close()"
    class="fixed inset-0 bg-slate-900/60 z-20 md:hidden backdrop-blur-sm transition-opacity animate-fadeIn">
</div>

<aside *ngIf="sidebarService.isOpen$ | async"
    class="w-[260px] bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-100 shrink-0 transition-all duration-300 ease-in-out shadow-xl flex flex-col fixed top-16 left-0 z-40 h-[calc(100vh-64px)] border-r border-slate-200 dark:border-slate-800 overflow-y-auto">

    <!-- HEADER DEL USUARIO -->
    <div class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">

        <div
            class="flex items-center gap-4 p-4 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-100 welcome-card">
            <div class="flex shrink-0 profile-picture">
                <img [src]="getProfileImage()" alt="Foto de Perfil"
                    class="w-[60px] h-[60px] rounded-full border-2 border-slate-300 dark:border-slate-600 object-cover">
            </div>

            <div class="flex flex-col welcome-info">
                <span class="text-sm font-light text-slate-500 dark:text-slate-400 welcome-text">{{bien}}</span>
                <span class="text-xl font-semibold leading-tight text-slate-800 dark:text-slate-200 user-name">{{
                    usuarioActual }}</span>

                <div class="flex gap-4 mt-2 action-icons">
                    <a [routerLink]="['/admin/dashboard']" class="hover:text-blue-800 dark:hover:text-blue-500 transition-colors action-icon"
                        title="Dashboard Principal">
                        <i class="fas fa-home text-sm"></i>
                    </a>
                    <button (click)="verPerfil()"
                        class="hover:text-blue-800 dark:hover:text-blue-500 transition-colors action-icon bg-transparent border-0 cursor-pointer"
                        title="Mi Perfil">
                        <i class="fas fa-user text-sm"></i>
                    </button>
                    <button (click)="cerrarSesion()"
                        class="hover:text-red-500 dark:hover:text-red-400 transition-colors action-icon bg-transparent border-0 cursor-pointer"
                        title="Cerrar Sesión">
                        <i class="fas fa-sign-out-alt text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MENÚ DINÁMICO COMPLETO -->
    <nav class="flex-1 px-2 py-4 space-y-1">

        <!-- Iterar sobre los grupos principales (CONFIGURACIONES, PROCESOS, REPORTES) -->
        <ng-container *ngFor="let grupo of menuDinamicoSanitizado">
            <div class="space-y-0 mx-0.5">
                <!-- Botón del grupo principal -->
                <button (click)="toggleGrupo(grupo.id)" [class.bg-slate-50]="grupoExpandido[grupo.id]"
                    [class.dark:bg-slate-800]="grupoExpandido[grupo.id]"
                    class="w-full flex items-center justify-between px-4 py-2.5 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-all duration-200 group">

                    <div class="flex items-center gap-3">
                        <!-- Icono dinámico del grupo (SVG) -->
                        <span class="dark:text-blue-400 text-[#0b4165] flex items-center justify-center">
                            <span [innerHTML]="grupo.icono" class="w-5 h-5 block [&>svg]:w-full [&>svg]:h-full"></span>
                        </span>
                        <span class="text-sm font-medium text-[#0b4165] dark:text-slate-200">{{ grupo.titulo }}</span>
                    </div>

                    <svg class="w-4 h-4 transition-transform duration-300 text-slate-400 dark:text-slate-500"
                        [ngClass]="grupoExpandido[grupo.id] ? 'rotate-0' : '-rotate-90'"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9 6 6 6-6" />
                    </svg>
                </button>

                <!-- Contenido del grupo cuando está expandido -->
                <div *ngIf="grupoExpandido[grupo.id]" class="relative mt-0" @slideDown>
                    <div class="ml-[14px]">
                        <!-- Línea vertical principal que conecta los ítems (GROSOR MEDIO) -->
                        <div class="absolute left-[25px] top-[14px] w-[1.5px] bg-[#394e60] dark:bg-slate-600 z-0"
                            [style.height]="'calc(100% - 28px)'"></div>

                        <!-- Iterar sobre los hijos del grupo (pueden ser SUBMENús o ITEMs) -->
                        <ng-container *ngFor="let child of grupo.children; let f = first; let l = last">

                            <!-- Si es un SUBMENU (ej: SEGURIDAD con sus items tipo CATEGORÍAS) -->
                            <div *ngIf="child.tipo === 'SUBMENU'" class="relative ml-1">
                                <!-- Botón del submenu con círculo MÁS PEQUEÑO -->
                                <button (click)="toggleSubmenu(child.id)"
                                    class="w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors group text-left">
                                    <div class="flex items-center gap-1.5">
                                        <!-- Círculo TAMAÑO MEDIO -->
                                        <div class="w-2.5 h-2.5 rounded-full flex items-center justify-center shrink-0"
                                            style="background-color: #34577D;">
                                            <!-- Mostrar los 3 puntitos SOLO cuando hay un item activo dentro del submenu -->
                                            <span *ngIf="verificarSubmenuActivo(child)"
                                                class="text-white text-[6.5px] font-bold leading-none">•••</span>
                                        </div>
                                        <span class="text-[0.75rem] font-body text-[#0b4165] dark:text-slate-200 uppercase">
                                            {{ child.titulo }}
                                        </span>
                                    </div>
                                    <i class="fas fa-chevron-right text-xs text-slate-400 dark:text-slate-500 transition-transform duration-200"
                                        [class.rotate-90]="submenuExpandido[child.id]"></i>
                                </button>

                                <!-- Items del submenu con conexión directa al grupo principal -->
                                <div *ngIf="submenuExpandido[child.id]" class="relative mt-1 ml-2">
                                    <!-- Línea vertical GROSOR MEDIO para items del submenu -->
                                    <div class="absolute left-[11px] top-[12px] w-[1.5px] bg-[#394e60] dark:bg-slate-600 z-0"
                                        [style.height]="'calc(100% - 28px)'"></div>

                                    <ng-container *ngFor="let subItem of child.children; let sf = first; let sl = last">
                                        <ng-container
                                            *ngTemplateOutlet="navLink; context: { item: subItem, isFirst: sf, isLast: sl }">
                                        </ng-container>
                                    </ng-container>
                                </div>
                            </div>

                            <!-- Si es un ITEM directo (sin submenu) -->
                            <ng-container *ngIf="child.tipo === 'ITEM'">
                                <ng-container
                                    *ngTemplateOutlet="navLink; context: { item: child, isFirst: f, isLast: l }">
                                </ng-container>
                            </ng-container>

                        </ng-container>
                    </div>
                </div>
            </div>
        </ng-container>

        <!-- Mensaje de carga -->
        <div *ngIf="loadingMenu" class="text-center text-slate-500 dark:text-slate-400 text-sm py-8 animate-pulse">
            <i class="fas fa-spinner fa-spin mb-2 text-2xl text-blue-600"></i>
            <p>Sincronizando accesos...</p>
        </div>

        <!-- Mensaje de menú vacío (después de cargar) -->
        <div *ngIf="!loadingMenu && menuCargado && menuDinamicoSanitizado.length === 0" 
             class="text-center text-slate-500 dark:text-slate-400 text-sm py-8 px-4 border border-dashed border-slate-200 dark:border-slate-800 rounded-xl mx-2">
            <i class="fas fa-shield-alt mb-2 text-3xl text-slate-300"></i>
            <p class="font-semibold text-slate-600 dark:text-slate-300">Sin módulos asignados</p>
            <p class="text-xs mt-1">Contacte con el administrador para habilitar sus permisos.</p>
        </div>

    </nav>
</aside>

<!-- TEMPLATE PARA LOS LINKS DE NAVEGACIÓN -->
<ng-template #navLink let-item="item" let-isFirst="isFirst" let-isLast="isLast">
    <div class="relative flex items-center">
        <!-- Contenedor de círculo alineado con la línea -->
        <div class="relative flex items-center shrink-0" style="width: 24px; height: 28px;">
            <!-- Círculo indicador TAMAÑO MEDIO, centrado en la línea vertical -->
            <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10 w-2.5 h-2.5 rounded-full flex items-center justify-center transition-all duration-300"
                [ngClass]="rutaActual === item.ruta ? 'bg-[#0b4165] dark:bg-blue-500' : 'bg-[#394e60] dark:bg-slate-600'">
                <!-- Check icon cuando está activo (TAMAÑO MEDIO) -->
                <svg *ngIf="rutaActual === item.ruta" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"
                    stroke-linejoin="round" class="w-[7px] h-[7px] text-white">
                    <path d="M20 6 9 17l-5-5"></path>
                </svg>
            </div>
        </div>

        <!-- Botón del link -->
        <button (click)="navegarA(item.ruta)"
            class="flex-1 flex items-center pl-2 pr-3 py-1 text-[0.75rem] transition-colors hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg min-w-0"
            [ngClass]="rutaActual === item.ruta ? 'font-medium' : ''">
            <span class="truncate font-body uppercase" [ngClass]="{
                    'text-[#0b4165] dark:text-blue-400 font-bold': rutaActual === item.ruta,
                    'text-slate-500 dark:text-slate-400': rutaActual !== item.ruta
                }">
                {{ item.titulo }}
            </span>
        </button>

        <!-- Línea vertical azul a la derecha cuando el item está activo -->
        <div *ngIf="rutaActual === item.ruta"
            class="absolute right-0 top-0 bottom-0 w-0.5 rounded-l-full transition-all duration-300 bg-blue-800 dark:bg-blue-500">
        </div>
    </div>
</ng-template>
