<div class="rounded-xl transition-all duration-300" [ngClass]="{
        'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm': !useGradient,
        'bg-gradient-to-r text-white': useGradient
    }" [class]="useGradient ? gradientFrom + ' ' + gradientTo : ''">

  <div class="px-4 py-3">
    <!-- Breadcrumb area (if items exist) -->
    <div *ngIf="breadcrumbItems.length > 0" class="mb-2">
      <nav class="flex" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 md:space-x-3">
          <li *ngFor="let item of breadcrumbItems; let last = last" class="inline-flex items-center">
            <div class="flex items-center">
              <span *ngIf="!item.route" class="text-xs font-medium text-slate-500 dark:text-slate-400">
                {{ item.label }}
              </span>
              <a *ngIf="item.route" [routerLink]="item.route"
                class="text-xs font-medium text-slate-500 hover:text-blue-600 dark:text-slate-400 dark:hover:text-white transition-colors">
                {{ item.label }}
              </a>
              <svg *ngIf="!last" class="w-3 h-3 text-slate-400 mx-1" aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="m1 9 4-4-4-4" />
              </svg>
            </div>
          </li>
        </ol>
      </nav>
    </div>

    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div [class]="useGradient ? 'bg-white/20' : 'bg-blue-50 dark:bg-slate-700'"
          class="p-2 rounded-lg backdrop-blur-sm transition-colors">
          <!-- Icono dinámico -->
          <svg [class]="useGradient ? 'text-white' : 'text-[#0b4165] dark:text-blue-400'" class="w-6 h-6" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="getIconPath()" />
          </svg>
        </div>
        <div>
          <h2 [class]="useGradient ? 'text-white' : 'text-slate-800 dark:text-white'"
            class="text-xl font-bold tracking-tight">{{ title }}</h2>
          <p *ngIf="subtitle" [class]="useGradient ? 'text-blue-100' : 'text-slate-500 dark:text-slate-400'"
            class="text-xs font-medium mt-0.5">{{ subtitle }}</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <!-- Acciones personalizadas -->
        <ng-content></ng-content>

        <!-- Contador opcional -->
        <div *ngIf="showCounter"
          [class]="useGradient ? 'bg-white/20 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'"
          class="px-3 py-1.5 rounded-lg backdrop-blur-sm transition-colors">
          <p class="text-xs font-medium">
            {{ counterLabel }}: <span [class]="useGradient ? 'text-white' : 'text-slate-900 dark:text-white'"
              class="text-sm font-bold ml-1">{{ counterValue }}</span>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
