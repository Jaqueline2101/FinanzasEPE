<!-- Backdrop Overlay -->
<div *ngIf="alert().show" 
     class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn"
     (click)="onBackdropClick()">
    
    <!-- Alert Modal Card -->
    <div class="bg-white dark:bg-slate-800 rounded-[2.5rem] shadow-2xl shadow-slate-900/40 w-full max-w-sm overflow-hidden transform transition-all duration-300 animate-bounceIn"
         (click)="$event.stopPropagation()">
        
        <div class="px-8 pt-10 pb-8 text-center">
            <!-- Icon Animation Container -->
            <div [ngClass]="getIconContainerClass()" 
                 class="mx-auto w-24 h-24 rounded-full flex items-center justify-center mb-6 relative">
                
                <!-- SVG Icons based on type -->
                <ng-container [ngSwitch]="alert().type">
                    <!-- Success Checkmark -->
                    <svg *ngSwitchCase="'success'" class="w-12 h-12 text-green-500 animate-scaleCheck" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                    </svg>
                    
                    <!-- Error X -->
                    <svg *ngSwitchCase="'error'" class="w-12 h-12 text-rose-500 animate-shake" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                    
                    <!-- Warning / Confirm Exclamation -->
                    <svg *ngSwitchCase="'warning'" class="w-12 h-12 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <svg *ngSwitchCase="'confirm'" class="w-12 h-12 text-orange-500 animate-shake" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    
                    <!-- Info i -->
                    <svg *ngSwitchCase="'info'" class="w-12 h-12 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </ng-container>
            </div>

            <!-- Text Content -->
            <h3 class="text-2xl font-black text-slate-800 dark:text-white mb-2 tracking-tight">
                {{ alert().title }}
            </h3>
            <div class="text-slate-500 dark:text-slate-400 text-sm leading-relaxed px-4" [innerHTML]="alert().message">
            </div>

            <!-- Optional Input for Prompt -->
            <div *ngIf="alert().showInput" class="px-4 mt-6 animate-fadeIn">
                <input #inputPrompt
                       type="text"
                       [placeholder]="alert().inputPlaceholder || 'Escriba aquí...'"
                       class="w-full px-5 py-4 bg-slate-50 dark:bg-slate-700/30 border border-slate-200 dark:border-slate-600 rounded-2xl text-slate-700 dark:text-white focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium placeholder:text-slate-400 text-center"
                       (keyup.enter)="onConfirm()"
                       autoFocus>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="px-8 pb-10">
            <!-- Normal Alert Button -->
            <button *ngIf="!isConfirm()"
                    (click)="close()"
                    [ngClass]="getButtonClass()"
                    class="w-full py-4 text-white font-bold rounded-2xl shadow-lg transition-all duration-200 active:scale-95 text-base uppercase tracking-wider">
                {{ isError() ? 'Entendido' : 'Aceptar' }}
            </button>

            <!-- Confirmation Buttons -->
            <div *ngIf="isConfirm()" class="flex gap-3">
                <button (click)="onConfirm()"
                        [ngClass]="alert().confirmButtonClass || 'bg-rose-500 hover:bg-rose-600 shadow-rose-500/30'"
                        class="flex-1 py-3.5 text-white font-bold rounded-2xl shadow-lg transition-all duration-200 active:scale-95 text-sm uppercase tracking-wider">
                    {{ alert().confirmText }}
                </button>
                <button (click)="onCancel()"
                        class="flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-2xl transition-all duration-200 active:scale-95 text-sm uppercase tracking-wider">
                    {{ alert().cancelText }}
                </button>
            </div>
        </div>
    </div>
</div>
