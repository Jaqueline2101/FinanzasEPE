<div class="animate-fadeIn pb-4">
    <div class="flex flex-col lg:flex-row gap-3 items-end">

        <!-- Search Selector (app-search-generic) -->
        <div class="flex-1 w-full">
            <app-search-generic 
                [options]="searchOptions" 
                [placeholder]="placeholder"
                (onSearch)="onSearchEvent($event)">
            </app-search-generic>
        </div>

        <!-- Custom Status Dropdown -->
        <div *ngIf="showStatus" class="relative w-full lg:w-48">
            <label class="block text-[10px] font-bold text-gray-500 dark:text-slate-400 uppercase tracking-wider mb-0.5 px-1">
                {{ statusLabel }}
            </label>
            <div class="relative">
                <!-- Trigger Button -->
                <button (click)="toggleEstadoDropdown($event)"
                    class="flex items-center justify-between w-full pl-3 pr-4 py-3 border border-gray-200 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 text-gray-600 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm transition-all duration-200 cursor-pointer shadow-sm">
                    <span>{{ getEstadoLabel() }}</span>
                    <i class="fas fa-chevron-down text-gray-400 text-xs transition-transform duration-200"
                       [class.rotate-180]="showEstadoDropdown"></i>
                </button>

                <!-- Custom Dropdown Menu -->
                <div *ngIf="showEstadoDropdown"
                    class="absolute left-0 top-full mt-2 w-full min-w-[160px] bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl z-[100] overflow-hidden animate-fadeIn">
                    <div class="py-1">
                        <button *ngFor="let opt of estadoOptions"
                            (click)="selectEstado(opt.value)"
                            class="w-full text-left px-4 py-2.5 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:text-slate-900 dark:hover:text-white transition-colors flex items-center justify-between group">
                            <span>{{ opt.label }}</span>
                            <svg *ngIf="filters.estado === opt.value" class="w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Extra Filters Slot -->
        <ng-content></ng-content>
        
        <!-- Filter Date Group -->
        <div *ngIf="showDates" class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
            <!-- Date From -->
            <div class="relative w-full sm:w-auto">
                <label class="block text-[10px] font-bold text-gray-500 dark:text-slate-400 uppercase tracking-wider mb-0.5 px-1">
                    Fecha Desde
                </label>
                <div class="relative">
                    <input type="date" [(ngModel)]="filters.fechaDesde" (ngModelChange)="onDateStartChange()"
                        class="block w-full sm:w-40 pl-3 pr-4 py-3 border border-gray-200 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 text-gray-600 dark:text-slate-300 focus:outline-none focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm transition-all duration-200 shadow-sm">
                </div>
            </div>

            <!-- Date To -->
            <div class="relative w-full sm:w-auto">
                <label class="block text-[10px] font-bold text-gray-500 dark:text-slate-400 uppercase tracking-wider mb-0.5 px-1">
                    Fecha Hasta
                </label>
                <div class="relative">
                    <input type="date" [(ngModel)]="filters.fechaHasta" (ngModelChange)="onDateEndChange()"
                        class="block w-full sm:w-40 pl-3 pr-4 py-3 border border-gray-200 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 text-gray-600 dark:text-slate-300 focus:outline-none focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm transition-all duration-200 shadow-sm">
                </div>
            </div>
        </div>

        <!-- Buttons Group -->
        <div class="flex gap-2 mt-[18px]">
            <!-- Filter Button -->
            <button (click)="emitFilters()"
                class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition-all duration-200 flex items-center justify-center gap-2 text-xs uppercase tracking-wider h-[44px]">
                <i class="fas fa-filter"></i>
                <span>Filtrar</span>
            </button>

            <!-- Reset Button -->
            <button (click)="resetFilters()"
                class="px-6 py-2.5 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-500 dark:text-slate-400 hover:text-gray-700 dark:hover:text-slate-200 hover:bg-gray-50 dark:hover:bg-slate-700 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 text-xs uppercase tracking-wider font-bold h-[44px]"
                title="Restablecer filtros">
                <i class="fas fa-redo"></i>
                <span>Restablecer</span>
            </button>
        </div>

    </div>
</div>
