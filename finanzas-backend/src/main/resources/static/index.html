  <!-- ⚡ SCRIPT ANTI-PARPADEO - APLICAR TEMA ANTES DE RENDERIZAR -->
  <script>
    (function () {
      try {
        // Leer tema guardado
        const savedTheme = localStorage.getItem('app-theme');

        // Determinar si debe ser modo oscuro
        let isDark = false;

        if (savedTheme !== null && savedTheme !== undefined) {
          // Manejar diferentes formatos que puede tener guardado
          isDark = savedTheme === 'true' || savedTheme === '"true"';
        }

        // Aplicar clase ANTES de que se renderice el body
        const html = document.documentElement;

        if (isDark) {
          html.classList.add('dark');
          console.log('🌙 [Anti-parpadeo] Modo oscuro aplicado desde localStorage');
        } else {
          html.classList.remove('dark');
          console.log('☀️ [Anti-parpadeo] Modo claro aplicado');
        }

        // Cuando el body esté disponible, aplicar también ahí
        document.addEventListener('DOMContentLoaded', function () {
          const body = document.body;
          if (isDark) {
            body.classList.add('dark');
          } else {
            body.classList.remove('dark');
          }
        });
      } catch (e) {
        console.error('❌ [Anti-parpadeo] Error al aplicar tema inicial:', e);
        // En caso de error, usar modo claro por defecto
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <style>
    /* Estilos inline para evitar flash de contenido sin estilo */
    html {
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    html:not(.dark) {
      background-color: #ffffff;
      color: #0f172a;
    }

    html.dark {
      background-color: #1a2332;
      color: #e8edf5;
    }

    /* Ocultar contenido hasta que Angular cargue */
    body {
      opacity: 0;
      transition: opacity 0.2s ease-in;
    }

    /* Mostrar cuando Angular esté listo */
    body.ng-ready {
      opacity: 1;
    }
  </style>
