spring.application.name=backend-finanzas
server.port=${PORT:10000}
server.address=0.0.0.0

# === OPTIMIZACIONES DE MEMORIA (Render Free Tier 512MB) ===
spring.jpa.open-in-view=false
spring.jmx.enabled=false
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# === BASE DE DATOS ===
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinica_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456eli}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
# spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Dirección del servidor Kafka (ajusta la IP si es necesario)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Configuración del Productor
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Opcional: ID del cliente
spring.kafka.producer.client-id=mi-nuevo-proyecto


# === FLYWAY (Migraciones) ===
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# === JWT (RSA) ===
jwt.private-key-path=classpath:keys/private_key.pem
jwt.public-key-path=classpath:keys/public_key.pem
jwt.expiration=1800000

# === SEGURIDAD (RF-13) ===
security.max-failed-attempts=5
security.block-duration-minutes=15
security.suspicious-ip-change-hours=1
security.max-concurrent-sessions=3

# === LOGGING ===
logging.pattern.console=%d{HH:mm:ss.SSS} %5p %-40.40logger{39} : %m%n%wEx
logging.level.root=INFO
logging.level.com.pe.finanzas=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# === EMAIL (SMTP) ===
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:omarcondor200@gmail.com}
spring.mail.password=${MAIL_PASSWORD:julia_rouq_cige_yxwo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# === ARCHIVOS ===
archivos.directorio=${FILES_DIR:/var/laboratorio/archivos}
archivos.max-size=10MB

# === MULTIPART ===
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# === TWILIO ===
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.whatsapp.from=whatsapp:+14155238886
twilio.whatsapp.enabled=false